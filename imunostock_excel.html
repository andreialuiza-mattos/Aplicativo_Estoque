          '<div class="meta">Solicitado em ' + fmtDate(p.data) + '</div></div>' + pedidoStatusPill(p.status) + '</div>' +
          '<div class="itens-summary">' + itensResumo + '</div>' +
          '<div class="pedido-card-actions"><button class="btn sm" data-action="confirm-pedido" data-id="' + p.id + '">' + icon("check", 13) + ' Confirmar envio</button></div></div>';
      });
      html += '</div>';
    }

    if (state.batches.length === 0) {
      html += '<div class="panel empty">' + icon("syringe", 40) + '<p><strong>Nenhuma vacina cadastrada ainda.</strong></p><p>Comece registrando o primeiro lote no estoque.</p>' +
        '<div style="margin-top:12px"><button class="btn" data-nav="entrada">Cadastrar primeiro lote</button></div></div>';
    }

    html += '</div>';
    return html;
  }

  // ---------------- estoque ----------------
  function batchRow(b, withActions) {
    var s = batchStatus(b), sf = shelfFill(b);
    var actions = '<span class="status-pill ' + s.cls + '" style="margin-right:6px"><span class="dot"></span>' + s.label + '</span>';
    if (withActions) {
      actions += '<button class="icon-btn" title="Gerar etiqueta" data-action="etiqueta" data-id="' + b.id + '">' + icon("tag", 14) + '</button>' +
        '<button class="icon-btn" title="Registrar saída" data-action="quick-saida" data-id="' + b.id + '">' + icon("out", 14) + '</button>' +
        '<button class="icon-btn" title="Remover lote" data-action="delete-batch" data-id="' + b.id + '">' + icon("trash", 14) + '</button>';
    }
    return '<div class="batch-row"><div><div class="name">' + esc(b.nome) + '</div><div class="sub">' + esc(b.fabricante) + ' · ' + esc(b.temperatura) + '</div>' + (b.apresentacao ? '<div class="sub">' + esc(b.apresentacao) + '</div>' : '') + (b.notaFiscal ? '<div class="sub">NF ' + esc(b.notaFiscal) + '</div>' : '') + '</div>' +
      '<div><span class="lot-chip">' + esc(b.lote) + '</span></div>' +
      '<div><div class="qty-badge">' + b.quantidade + '</div><div class="sub">de ' + b.quantidadeInicial + ' frascos</div></div>' +
      '<div><div class="shelf-bar"><div class="fill" style="width:' + sf.pct + '%;background:' + sf.color + '"></div></div>' +
      '<div class="shelf-meta"><span>Val. ' + fmtDate(b.validade) + '</span><span>' + (sf.dleft < 0 ? "vencido" : sf.dleft + "d") + '</span></div></div>' +
      '<div class="row-actions">' + actions + '</div></div>';
  }

  function filteredBatches() {
    return state.batches.filter(function (b) {
      var s = batchStatus(b);
      var matchesFilter = state.filterEstoque === "todos" || s.key === state.filterEstoque;
      var hay = (b.nome + " " + b.lote + " " + b.fabricante).toLowerCase();
      var matchesSearch = hay.indexOf(state.searchEstoque.toLowerCase()) !== -1;
      return matchesFilter && matchesSearch;
    }).sort(function (a, b) { return daysUntil(a.validade) - daysUntil(b.validade); });
  }

  function estoqueListHtml() {
    var filtered = filteredBatches();
    if (filtered.length === 0) {
      return '<div class="panel empty">' + icon("search", 40) + '<p><strong>Nenhum lote encontrado.</strong></p><p>Ajuste os filtros ou cadastre um novo lote.</p></div>';
    }
    return '<div class="batch-list">' + filtered.map(function (b) { return batchRow(b, true); }).join("") + '</div>';
  }

  function updateEstoqueList() {
    var container = document.getElementById("estoqueListContainer");
    if (container) container.innerHTML = estoqueListHtml();
    var chips = document.querySelectorAll('[data-filter-estoque]');
    chips.forEach(function (c) { c.classList.toggle("active", c.getAttribute("data-filter-estoque") === state.filterEstoque); });
  }

  function renderEstoque() {
    var filters = [["todos", "Todos"], ["ok", "Regular"], ["vencendo", "Vencendo"], ["vencido", "Vencido"], ["baixo", "Estoque baixo"], ["vazio", "Esgotado"]];
    var chipsHtml = filters.map(function (f) {
      var active = state.filterEstoque === f[0] ? " active" : "";
      return '<button class="chip-filter' + active + '" data-filter-estoque="' + f[0] + '">' + f[1] + '</button>';
    }).join("");

    return '<div><div class="page-head"><div><h1>Estoque de vacinas</h1><p>' + state.batches.length + ' lote' + (state.batches.length !== 1 ? "s" : "") + ' no total.</p></div>' +
      '<div class="head-actions"><button class="btn secondary" data-action="export-excel">' + icon("download", 15) + ' Excel</button>' +
      '<button class="btn" data-nav="entrada">' + icon("plus", 15) + ' Novo lote</button></div></div>' +
      '<div class="filters"><input class="search-input" id="estoqueSearch" placeholder="Buscar por vacina, lote ou fabricante…" value="' + esc(state.searchEstoque) + '">' + chipsHtml + '</div>' +
      '<div id="estoqueListContainer">' + estoqueListHtml() + '</div></div>';
  }

  // ---------------- nova entrada ----------------
  function renderEntrada() {
    var vacinasOpts = state.settings.vacinas.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join("");
    var fabOpts = state.settings.fabricantes.map(function (f) { return '<option value="' + esc(f) + '">' + esc(f) + '</option>'; }).join("");

    return '<div><div class="page-head"><div><h1>Nova entrada de lote</h1><p>Cadastre um novo lote recebido no estoque.</p></div></div>' +
      '<form class="panel" id="entradaForm"><div class="form-grid">' +
      '<div class="field"><label>Vacina</label><select id="f-nome"><option value="">Selecione…</option>' + vacinasOpts + '<option value="__custom__">Outra (especificar)</option></select><span class="field-error" id="err-nome"></span></div>' +
      '<div class="field" id="f-nome-custom-wrap" style="display:none"><label>Nome da vacina</label><input id="f-nome-custom" placeholder="Ex: Vacina X"></div>' +
      '<div class="field"><label>Fabricante</label><select id="f-fabricante">' + fabOpts + '</select></div>' +
      '<div class="field"><label>Apresentação</label><input id="f-apresentacao" list="dl-apresentacao" autocomplete="off" placeholder="Ex: Frasco-ampola 10 doses"></div>' +
      '<datalist id="dl-apresentacao"><option value="Frasco-ampola 1 dose"><option value="Frasco-ampola 5 doses"><option value="Frasco-ampola 10 doses"><option value="Frasco-ampola 20 doses"><option value="Frasco multidose"><option value="Frasco-ampola liofilizado + diluente"><option value="Seringa preenchida"><option value="Ampola"><option value="Bisnaga (gotas orais)"></datalist>' +
      '<div class="field"><label>Número do lote</label><input id="f-lote" placeholder="Ex: LT2026-0451"><span class="field-error" id="err-lote"></span></div>' +
      '<div class="field"><label>Número da nota fiscal</label><input id="f-nota" placeholder="Ex: 000123456"><span class="field-error" id="err-nota"></span></div>' +
      '<div class="field"><label>Quantidade (frascos)</label><input type="number" min="1" id="f-quantidade" placeholder="Ex: 100"><span class="field-error" id="err-quantidade"></span></div>' +
      '<div class="field"><label>Estoque mínimo (alerta)</label><input type="number" min="0" id="f-estoqueMinimo" value="20"></div>' +
      '<div class="field"><label>Data de validade</label><input type="date" id="f-validade"><span class="field-error" id="err-validade"></span></div>' +
      '<div class="field"><label>Data de entrada</label><input type="date" id="f-dataEntrada" value="' + todayISO() + '"></div>' +
      '<div class="field"><label>Etiquetas a gerar no cadastro</label><input type="number" min="0" max="200" id="f-etiquetas" value="1"></div>' +
      '<div class="field span2"><label>Faixa de temperatura de armazenamento</label><select id="f-temperatura">' +
      '<option>2°C a 8°C</option><option>-15°C a -25°C</option><option>-60°C a -90°C (ultracongelamento)</option><option>Temperatura ambiente</option></select></div>' +
      '</div><div class="form-actions"><button type="submit" class="btn">' + icon("plus", 15) + ' Cadastrar lote</button></div></form></div>';
  }

  function bindEntradaEvents() {
    var nomeSel = document.getElementById("f-nome");
    if (!nomeSel) return;
    nomeSel.addEventListener("change", function () {
      document.getElementById("f-nome-custom-wrap").style.display = nomeSel.value === "__custom__" ? "flex" : "none";
    });
    document.getElementById("entradaForm").addEventListener("submit", function (e) {
      e.preventDefault();
      ["nome", "lote", "nota", "quantidade", "validade"].forEach(function (k) { document.getElementById("err-" + k).textContent = ""; });
      var nomeVal = nomeSel.value === "__custom__" ? document.getElementById("f-nome-custom").value.trim() : nomeSel.value;
      var lote = document.getElementById("f-lote").value.trim();
      var quantidade = parseInt(document.getElementById("f-quantidade").value, 10);
      var validade = document.getElementById("f-validade").value;
      var ok = true;
      if (!nomeVal) { document.getElementById("err-nome").textContent = "Informe a vacina."; ok = false; }
      if (!lote) { document.getElementById("err-lote").textContent = "Informe o número do lote."; ok = false; }
      var nota = document.getElementById("f-nota").value.trim();
      if (!nota) { document.getElementById("err-nota").textContent = "Informe o número da nota fiscal."; ok = false; }
      if (!quantidade || quantidade <= 0) { document.getElementById("err-quantidade").textContent = "Quantidade inválida."; ok = false; }
      if (!validade) { document.getElementById("err-validade").textContent = "Informe a validade."; ok = false; }
      if (!ok) return;
      var nEtiq = parseInt(document.getElementById("f-etiquetas").value, 10) || 0;
      var novo = addBatch({
        notaFiscal: nota,
        apresentacao: document.getElementById("f-apresentacao").value.trim(),
        nome: nomeVal,
        fabricante: document.getElementById("f-fabricante").value,
        lote: lote.toUpperCase(),
        quantidade: quantidade,
        validade: validade,
        dataEntrada: document.getElementById("f-dataEntrada").value || todayISO(),
        temperatura: document.getElementById("f-temperatura").value,
        estoqueMinimo: parseInt(document.getElementById("f-estoqueMinimo").value, 10) || 10
      });
      if (nEtiq > 0 && novo) generateEtiqueta(novo, nEtiq);
      renderMain(); // formulário limpo
    });
  }

  // ---------------- registrar saída ----------------
  function renderSaida() {
    var disponiveis = state.batches.filter(function (b) { return b.quantidade > 0; });
    if (disponiveis.length === 0) {
      return '<div><div class="page-head"><div><h1>Registrar saída</h1><p>Registre a saída de frascos (com unidade de origem e destino) ou o descarte de um lote.</p></div></div>' +
        '<div class="panel"><div class="empty" style="padding:10px 0"><p>Não há lotes com frascos disponíveis no momento.</p></div></div></div>';
    }
    var opts = disponiveis.map(function (b) {
      return '<option value="' + b.id + '" data-max="' + b.quantidade + '">' + esc(b.nome) + ' — ' + esc(b.lote) + ' (' + b.quantidade + ' frascos disponíveis)</option>';
    }).join("");

    return '<div><div class="page-head"><div><h1>Registrar saída</h1><p>Registre a saída de frascos (com unidade de origem e destino) ou o descarte de um lote.</p></div></div>' +
      '<form class="panel" id="saidaForm"><div class="form-grid">' +
      '<div class="field span2"><label>Lote</label><select id="s-batch"><option value="">Selecione um lote…</option>' + opts + '</select></div>' +
      '<div class="field"><label>Tipo de movimentação</label><select id="s-tipo">' +
      '<option value="saida">Saída de frascos</option><option value="descarte">Descarte (perda / vencimento)</option><option value="entrada">Ajuste — entrada adicional</option></select></div>' +
      '<div class="field"><label>Quantidade de frascos</label><input type="number" min="1" id="s-quantidade" placeholder="Ex: 5"></div>' +
      '<div class="field"><label id="lbl-s-origem">Unidade / estabelecimento de origem</label><input id="s-origem" list="dl-unidades" autocomplete="off" placeholder="Ex: Central de Rede de Frio Municipal" value="' + esc(ultimaOrigem()) + '"></div>' +
      '<div class="field"><label id="lbl-s-destino">Unidade / estabelecimento de destino</label><input id="s-destino" list="dl-unidades" autocomplete="off" placeholder="Ex: UBS Jardim das Flores"></div>' +
      '<datalist id="dl-unidades">' + unidadesConhecidas().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("") + '</datalist>' +
      '<div class="field span2"><label>Observação (opcional)</label><input id="s-motivo" placeholder="Ex: Campanha de vacinação infantil"></div>' +
      '</div><p class="field-error" id="err-saida" style="margin-top:10px"></p>' +
      '<div class="form-actions"><button type="submit" class="btn">' + icon("out", 15) + ' Registrar</button></div></form></div>';
  }

  function ultimaOrigem() {
    var m = state.movements.find(function (x) { return (x.tipo === "saida" || x.tipo === "remessa") && x.origem; });
    return m ? m.origem : "";
  }
  function bindSaidaEvents() {
    var form = document.getElementById("saidaForm");
    if (!form) return;
    var tipoSel = document.getElementById("s-tipo");
    function syncTipo() {
      var t = tipoSel.value, dest = document.getElementById("s-destino");
      var lo = document.getElementById("lbl-s-origem"), ld = document.getElementById("lbl-s-destino");
      lo.textContent = "Unidade / estabelecimento de origem" + (t === "entrada" ? " (opcional)" : "");
      ld.textContent = "Unidade / estabelecimento de destino" + (t === "saida" ? "" : t === "descarte" ? " (não se aplica)" : " (opcional)");
      dest.disabled = t === "descarte";
      if (t === "descarte") dest.value = "";
    }
    tipoSel.addEventListener("change", syncTipo);
    syncTipo();
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var errEl = document.getElementById("err-saida");
      errEl.textContent = "";
      var sel = document.getElementById("s-batch");
      var batchId = sel.value;
      var tipo = document.getElementById("s-tipo").value;
      var q = parseInt(document.getElementById("s-quantidade").value, 10);
      var motivo = document.getElementById("s-motivo").value.trim();
      if (!batchId) { errEl.textContent = "Selecione um lote."; return; }
      if (!q || q <= 0) { errEl.textContent = "Informe uma quantidade válida."; return; }
      var origem = document.getElementById("s-origem").value.trim();
      var destino = document.getElementById("s-destino").value.trim();
      if ((tipo === "saida" || tipo === "descarte") && !origem) { errEl.textContent = "Informe a unidade/estabelecimento de origem."; return; }
      if (tipo === "saida" && !destino) { errEl.textContent = "Informe a unidade/estabelecimento de destino."; return; }
      var max = parseInt(sel.options[sel.selectedIndex].getAttribute("data-max"), 10);
      if ((tipo === "saida" || tipo === "descarte") && q > max) { errEl.textContent = "Apenas " + max + " frascos disponíveis neste lote."; return; }
      registerMovement(batchId, tipo, q, motivo || undefined, origem, destino);
      renderMain();
    });
  }

  // ---------------- histórico ----------------
  function historicoListHtml() {
    var filtered = state.movements.filter(function (m) { return state.filterHistorico === "todos" || m.tipo === state.filterHistorico; });
    if (filtered.length === 0) {
      return '<div class="empty">' + icon("history", 40) + '<p>Nenhuma movimentação registrada ainda.</p></div>';
    }
    var rows = '<div class="hist-row head"><div>Data</div><div>Vacina / lote</div><div>Tipo</div><div>Frascos</div><div>Origem</div><div>Destino</div><div>Observação</div></div>';
    rows += filtered.map(function (m) {
      return '<div class="hist-row"><div class="mono" style="font-size:12px">' + new Date(m.data).toLocaleDateString("pt-BR") + '</div>' +
        '<div><strong>' + esc(m.vacinaNome) + '</strong> <span class="lot-chip" style="margin-left:4px">' + esc(m.lote) + '</span></div>' +
        '<div><span class="move-tag ' + m.tipo + '">' + tipoLabel(m.tipo) + '</span></div>' +
        '<div class="mono">' + m.quantidade + '</div>' +
        '<div>' + esc(m.origem || "—") + '</div><div>' + esc(m.destino || "—") + '</div>' +
        '<div style="color:var(--ink-soft)">' + esc(m.motivo || "—") + '</div></div>';
    }).join("");
    return rows;
  }
  function updateHistoricoList() {
    var container = document.getElementById("historicoListContainer");
    if (container) container.innerHTML = historicoListHtml();
    var chips = document.querySelectorAll('[data-filter-historico]');
    chips.forEach(function (c) { c.classList.toggle("active", c.getAttribute("data-filter-historico") === state.filterHistorico); });
  }
  function destResumoHtml() {
    var r = saidasPorDestino(state.movements);
    if (!r.rows.length) return "";
    return '<div class="panel"><h2>Saídas por unidade de destino (frascos)</h2><div class="dest-summary">' +
      r.rows.map(function (x) { return '<div>' + esc(x.destino) + '</div><div class="n">' + x.frascos + '</div>'; }).join("") +
      '<div class="tot">Total de frascos que saíram</div><div class="n tot">' + r.total + '</div></div></div>';
  }
  function renderHistorico() {
    var filters = [["todos", "Todos"], ["entrada", "Entradas"], ["saida", "Saídas"], ["remessa", "Remessas"], ["descarte", "Descartes"]];
    var chipsHtml = filters.map(function (f) {
      var active = state.filterHistorico === f[0] ? " active" : "";
      return '<button class="chip-filter' + active + '" data-filter-historico="' + f[0] + '">' + f[1] + '</button>';
    }).join("");
    return '<div><div class="page-head"><div><h1>Histórico de movimentações</h1><p>' + state.movements.length + ' registro' + (state.movements.length !== 1 ? "s" : "") + ' no total.</p></div>' +
      '<div class="head-actions"><button class="btn secondary" data-action="export-excel">' + icon("download", 15) + ' Excel</button>' +
      '<button class="btn secondary" data-action="export-pdf">' + icon("file", 15) + ' PDF</button></div></div>' +
      destResumoHtml() +
      '<div class="filters">' + chipsHtml + '</div>' +
      '<div class="panel" id="historicoListContainer">' + historicoListHtml() + '</div></div>';
  }

  // ---------------- configurações ----------------
  function tagListHtml(items, kind) {
    if (items.length === 0) return '<span style="font-size:12.5px;color:var(--ink-soft)">Nenhum item na lista — adicione ao menos um.</span>';
    return items.map(function (v) {
      return '<span class="tag-item">' + esc(v) + '<button data-action="remove-' + kind + '" data-value="' + esc(v) + '" title="Remover">' + icon("trash", 11) + '</button></span>';
    }).join("");
  }
  function localPanelHtml() {
    var size = JSON.stringify({ b: state.batches, m: state.movements, r: state.remessas, p: state.pedidos }).length;
    var kb = Math.max(1, Math.round(size / 1024));
    var lb = lsGet(LAST_BACKUP_KEY);
    var lbTxt = lb ? new Date(lb).toLocaleString("pt-BR") : "nunca";
    var st;
    if (!FSA) st = "Seu navegador não permite gravar direto em arquivo. Use o Chrome ou o Edge para a gravação automática; nos demais, baixe a planilha manualmente.";
    else if (fileState.status === "ok") st = "Gravação automática ativa em " + fileState.name + (fileState.savedAt ? " (última gravação às " + fileState.savedAt.toLocaleTimeString("pt-BR") + ")" : "") + ".";
    else if (fileState.status === "pending") st = "Arquivo " + fileState.name + " vinculado, aguardando permissão. Clique em Reconectar.";
    else if (fileState.status === "error") st = "Erro ao gravar " + fileState.name + ": " + fileState.msg + ".";
    else st = "Nenhum arquivo vinculado. Os dados estão apenas neste navegador.";
    var stColor = fileState.status === "ok" ? "var(--ok)" : fileState.status === "error" ? "var(--danger)" : "var(--ink-soft)";
    var linked = !!fileState.handle;

      '<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px">Vincule uma planilha <strong>.xlsx</strong> e o app grava nela automaticamente a cada alteração (lotes, movimentações, remessas, pedidos e listas, uma aba para cada). Ao abrir o app, os dados são lidos do arquivo. Você pode editar a planilha no Excel — feche-a antes de voltar ao app para que ele consiga gravar.</p>' +
      '<p style="font-size:13px;margin:0 0 10px;color:' + stColor + '">' + esc(st) + '</p>' +
      '<div class="form-actions" style="flex-wrap:wrap;gap:8px">' +
      '<button type="button" class="btn sm" data-action="file-new">Criar arquivo Excel…</button>' +
      '<button type="button" class="btn secondary sm" data-action="file-open">Abrir arquivo existente…</button>' +
      (fileState.status === "pending" ? '<button type="button" class="btn sm" data-action="file-reconnect">Reconectar</button>' : '') +
      (linked ? '<button type="button" class="btn secondary sm" data-action="file-reload">Recarregar do arquivo</button><button type="button" class="btn secondary sm" data-action="file-unlink">Desvincular</button>' : '') +
      '</div>' +
      '<h3 style="margin:16px 0 6px">Exportar e importar manualmente</h3>' +
      '<div class="form-actions" style="flex-wrap:wrap;gap:8px">' +
      '<button type="button" class="btn secondary sm" data-action="xl-download">' + icon("download", 13) + ' Baixar Excel agora</button>' +
      '<button type="button" class="btn secondary sm" data-action="csv-export">' + icon("download", 13) + ' Exportar CSV (lotes, movimentações, remessas, pedidos)</button>' +
      '<label class="btn secondary sm" style="cursor:pointer">Importar Excel…<input type="file" id="xlImportFile" accept=".xlsx,.xls" style="display:none"></label></div>' +
      '<p style="font-size:12px;color:var(--ink-soft);margin:8px 0 0">O CSV usa ponto e vírgula como separador (padrão do Excel em português) e serve para consulta; para restaurar dados use o Excel (.xlsx) ou o backup JSON.</p>' +
      '</div>' +
      '<div class="panel"><h2>Armazenamento no navegador e backup</h2>' +
      '<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px">Uma cópia dos dados também fica neste navegador, para o app abrir mesmo sem o arquivo. Limpar os dados de navegação apaga essa cópia (o arquivo Excel não é afetado).</p>' +
      '<p style="font-size:13px;margin:0 0 4px"><strong>' + state.batches.length + '</strong> lotes · <strong>' + state.movements.length + '</strong> movimentações · <strong>' + state.remessas.length + '</strong> remessas · <strong>' + state.pedidos.length + '</strong> pedidos · ≈ ' + kb + ' KB</p>' +
      '<p style="font-size:13px;margin:0 0 10px">Último backup manual: ' + esc(lbTxt) + '</p>' +
      '<div class="form-actions" style="flex-wrap:wrap;gap:8px"><button type="button" class="btn secondary sm" data-action="bk-export">' + icon("download", 13) + ' Exportar backup (JSON)</button>' +
      '<label class="btn secondary sm" style="cursor:pointer">Importar backup (JSON)<input type="file" id="bkImportFile" accept=".json,application/json" style="display:none"></label>' +
      '<button type="button" class="btn secondary sm" data-action="bk-clear">Apagar todos os dados</button></div></div>';
  }
  function renderConfig() {
    return '<div><div class="page-head"><div><h1>Configurações</h1><p>Personalize as listas usadas no cadastro de novos lotes. As alterações ficam salvas neste computador.</p></div></div>' +
      localPanelHtml() +

      '<div class="field"><label>Data de envio</label><input type="date" id="r-dataEnvio" value="' + todayISO() + '"></div>' +
      '<div class="field span2"><label>Observações (opcional)</label><textarea id="r-observacoes" placeholder="Instruções especiais, número de lacre, etc."></textarea></div>' +
      '</div><p class="field-error" id="err-remessa" style="margin-top:6px"></p>' +
      '<div class="form-actions"><button type="submit" class="btn" ' + (remessaCart.length === 0 ? "disabled" : "") + '>' + icon("truck", 15) + ' Gerar guia e registrar remessa</button></div></form>' +

      guiasEmitidasHtml() + '</div>';

  function bindRemessaEvents() {
    var itemForm = document.getElementById("remessaItemForm");
    if (itemForm) {
      itemForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var errEl = document.getElementById("err-cart-item");
        errEl.textContent = "";
        var sel = document.getElementById("r-batch");
        if (!sel.value) { errEl.textContent = "Selecione um lote."; return; }
        var opt = sel.options[sel.selectedIndex];
        var max = parseInt(opt.getAttribute("data-max"), 10);
        var jaNoCarrinho = remessaCart.filter(function (it) { return it.batchId === sel.value; }).reduce(function (s, it) { return s + it.quantidade; }, 0);
        var q = parseInt(document.getElementById("r-quantidade").value, 10);
        if (!q || q <= 0) { errEl.textContent = "Informe uma quantidade válida."; return; }
        if (q + jaNoCarrinho > max) { errEl.textContent = "Apenas " + (max - jaNoCarrinho) + " frascos disponíveis para este lote."; return; }
        remessaCart.push({
          batchId: sel.value, nome: opt.getAttribute("data-nome"), fabricante: opt.getAttribute("data-fabricante"),
          lote: opt.getAttribute("data-lote"), validade: opt.getAttribute("data-validade"), quantidade: q
        });
        renderMain();
      });
    }

    var mainForm = document.getElementById("remessaForm");
    if (mainForm) {
      mainForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var errEl = document.getElementById("err-remessa");
        ["origem", "destino"].forEach(function (k) { document.getElementById("err-" + k).textContent = ""; });
        errEl.textContent = "";
        var origem = document.getElementById("r-origem").value.trim();
        var destino = document.getElementById("r-destino").value.trim();
        var ok = true;
        if (remessaCart.length === 0) { errEl.textContent = "Adicione ao menos um item à guia antes de gerar."; ok = false; }
        if (!origem) { document.getElementById("err-origem").textContent = "Informe a unidade de origem."; ok = false; }
        if (!destino) { document.getElementById("err-destino").textContent = "Informe a unidade de destino."; ok = false; }
        if (!ok) return;

        registerRemessa({
          origem: origem,
          responsavelOrigem: document.getElementById("r-respOrigem").value.trim(),
          destino: destino,
          responsavelDestino: document.getElementById("r-respDestino").value.trim(),
          enderecoDestino: document.getElementById("r-endereco").value.trim(),
          transporte: document.getElementById("r-transporte").value,
          temperatura: document.getElementById("r-temperatura").value,
          caixaTermica: document.getElementById("r-caixa").value.trim(),
          dataEnvio: document.getElementById("r-dataEnvio").value || todayISO(),
          observacoes: document.getElementById("r-observacoes").value.trim(),
          itens: remessaCart.slice()
        });
        remessaCart = [];
        renderMain();
      });
    }
  }

  // ---------------- pedidos (páginas) ----------------
  // Estoque de uma vacina para pedidos: frascos válidos (não vencidos) e vencidos, somando todos os lotes.
  function estoqueVacina(nome) {
    var valido = 0, vencido = 0, lotes = 0;
    state.batches.forEach(function (b) {
      if (b.nome !== nome || b.quantidade <= 0) return;
      lotes++;
      if (daysUntil(b.validade) < 0) vencido += b.quantidade; else valido += b.quantidade;
    });
    return { valido: valido, vencido: vencido, lotes: lotes };
  }
  // Texto colorido: verde = atende o pedido, amarelo = estoque insuficiente, vermelho = sem estoque.
  function estoqueTagHtml(nome, solicitado) {
    var e = estoqueVacina(nome), cor, txt;
    if (e.valido <= 0) { cor = "var(--danger)"; txt = "Sem estoque válido"; }
    else if (solicitado != null && e.valido < solicitado) { cor = "var(--amber)"; txt = "Estoque: " + e.valido + " frascos — insuficiente (faltam " + (solicitado - e.valido) + ")"; }
    else { cor = "var(--ok)"; txt = "Estoque: " + e.valido + " frascos"; }
    if (e.valido > 0 && e.lotes > 1) txt += " em " + e.lotes + " lotes";
    if (e.vencido > 0) txt += " (+" + e.vencido + " vencidos)";
    return '<span style="color:' + cor + ';font-weight:600;font-size:12px">' + txt + '</span>';
  }

  function estoqueSituacao(nome, solicitado) {
    var e = estoqueVacina(nome);
    if (e.valido <= 0) return { e: e, txt: "Sem estoque válido", cor: "var(--danger)" };
    if (e.valido < solicitado) return { e: e, txt: "Insuficiente (faltam " + (solicitado - e.valido) + ")", cor: "var(--amber)" };
    return { e: e, txt: "Estoque suficiente", cor: "var(--ok)" };
  }
  function estoqueCelula(e) { return e.valido + (e.vencido ? " (+" + e.vencido + " venc.)" : ""); }

  // Tabela dos itens do pedido: vacina, solicitado, estoque atual e situação.
  function pedidoItensTableHtml(p) {
    var conf = p.status === "confirmado" && p.confirmacao, enviado = {};
    if (conf) (p.confirmacao.itensEnviados || []).forEach(function (it) { enviado[it.nome] = (enviado[it.nome] || 0) + it.quantidade; });
    var rows = p.itens.map(function (it) {
      var s = estoqueSituacao(it.nome, it.quantidade), sit = s.txt, cor = s.cor;
      if (conf) {
        var env = enviado[it.nome] || 0;
        sit = env >= it.quantidade ? "Atendido" : env > 0 ? "Parcial (" + env + " de " + it.quantidade + ")" : "Não enviado";
        cor = env >= it.quantidade ? "var(--ok)" : env > 0 ? "var(--amber)" : "var(--danger)";
      } else if (p.status === "cancelado") { sit = "Cancelado"; cor = "var(--ink-soft)"; }
      var corEst = p.status === "pendente" ? s.cor : "var(--ink)";
      return '<tr><td><strong>' + esc(it.nome) + '</strong></td><td class="n">' + it.quantidade + '</td><td class="n" style="color:' + corEst + ';font-weight:600">' + estoqueCelula(s.e) + '</td><td style="color:' + cor + ';font-weight:600">' + sit + '</td></tr>';
    }).join("");
    return '<div class="table-scroll"><table class="ped-table"><thead><tr><th>Vacina</th><th class="n">Solicitado (frascos)</th><th class="n">Estoque atual (frascos)</th><th>Situação</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function pedidoStatusPill(status) {
    if (status === "confirmado") return '<span class="status-pill ok"><span class="dot"></span>Confirmado</span>';
    if (status === "cancelado") return '<span class="status-pill danger"><span class="dot"></span>Cancelado</span>';
    return '<span class="status-pill amber"><span class="dot"></span>Pendente</span>';
  }

  function renderPedidos() {
    var filters = [["todos", "Todos"], ["pendente", "Pendentes"], ["confirmado", "Confirmados"], ["cancelado", "Cancelados"]];
    var chipsHtml = filters.map(function (f) {
      var active = state.filterPedidos === f[0] ? " active" : "";
      return '<button class="chip-filter' + active + '" data-filter-pedidos="' + f[0] + '">' + f[1] + '</button>';
    }).join("");

    return '<div><div class="page-head"><div><h1>Pedidos das unidades de saúde</h1><p>Acompanhe as solicitações e confirme os envios com os lotes efetivamente enviados.</p></div>' +
      '<div class="head-actions"><button class="btn" data-nav="novo-pedido">' + icon("plus", 15) + ' Novo pedido</button></div></div>' +
      '<div class="filters">' + chipsHtml + '</div>' +
      '<div id="pedidosListContainer">' + pedidosListHtml() + '</div></div>';
  }

  function pedidosListHtml() {
    var filtered = state.pedidos.filter(function (p) { return state.filterPedidos === "todos" || p.status === state.filterPedidos; });
    if (filtered.length === 0) {
      return '<div class="panel empty">' + icon("clipboard", 40) + '<p><strong>Nenhum pedido encontrado.</strong></p><p>Registre um novo pedido de uma unidade de saúde.</p></div>';
    }
    return filtered.map(function (p) {
      var itensResumo = pedidoItensTableHtml(p);
      var actions = "";
      if (p.status === "pendente") {
        actions = '<div class="pedido-card-actions">' +
          '<button class="btn sm" data-action="confirm-pedido" data-id="' + p.id + '">' + icon("check", 13) + ' Confirmar envio</button>' +
          '<button class="btn secondary sm" data-action="cancel-pedido" data-id="' + p.id + '">' + icon("x", 13) + ' Cancelar</button></div>';
      } else if (p.status === "confirmado" && p.confirmacao) {
        actions = '<div class="pedido-card-actions"><span style="font-size:12px;color:var(--ink-soft)">Guia ' + esc(p.confirmacao.remessaNumero) + ' gerada em ' + fmtDate(p.confirmacao.data) + '</span>' +
          '<button class="btn secondary sm" data-action="reprint-guia" data-id="' + p.confirmacao.remessaId + '">' + icon("file", 13) + ' Baixar guia</button></div>';
      }
      return '<div class="pedido-card"><div class="pedido-card-top"><div>' +
        '<div class="num">' + p.numero + ' — ' + esc(p.unidade) + '</div>' +
        '<div class="meta">Solicitado em ' + fmtDate(p.data) + (p.responsavel ? " por " + esc(p.responsavel) : "") + '</div>' +
        '</div>' + pedidoStatusPill(p.status) + '</div>' +
        '<div class="itens-summary">' + itensResumo + '</div>' +
        (p.observacoes ? '<div class="itens-summary" style="color:var(--ink-soft)">Obs.: ' + esc(p.observacoes) + '</div>' : "") +
        '<div class="pedido-card-actions" style="margin-bottom:6px"><button class="btn secondary sm" data-action="pedido-pdf" data-id="' + p.id + '">' + icon("file", 13) + ' PDF do pedido</button></div>' +
        actions + '</div>';
    }).join("");
  }
  function updatePedidosList() {
    var container = document.getElementById("pedidosListContainer");
    if (container) container.innerHTML = pedidosListHtml();
    document.querySelectorAll("[data-filter-pedidos]").forEach(function (c) { c.classList.toggle("active", c.getAttribute("data-filter-pedidos") === state.filterPedidos); });
  }

  function pedidoCartHtml() {
    if (pedidoCart.length === 0) {
      return '<p style="font-size:12.5px;color:var(--ink-soft);margin-top:10px">Nenhuma vacina adicionada ainda.</p>';
    }
    var cols = 'grid-template-columns:2fr 1fr 1.4fr auto';
    var head = '<div class="cart-row" style="' + cols + ';font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase"><div>Vacina</div><div>Solicitado</div><div>Estoque atual</div><div style="width:28px"></div></div>';
    var rows = pedidoCart.map(function (it, idx) {
      var s = estoqueSituacao(it.nome, it.quantidade);
      var aviso = s.e.valido <= 0 ? ' — sem estoque' : s.e.valido < it.quantidade ? ' — insuficiente' : '';
      return '<div class="cart-row" style="' + cols + '"><div><strong>' + esc(it.nome) + '</strong></div>' +
        '<div class="mono">' + it.quantidade + ' frascos</div>' +
        '<div class="mono" style="color:' + s.cor + ';font-weight:600">' + estoqueCelula(s.e) + ' frascos<span style="font-family:inherit;font-weight:500;font-size:11.5px">' + aviso + '</span></div>' +
        '<button class="icon-btn" title="Remover item" data-action="remove-pedido-cart-item" data-idx="' + idx + '">' + icon("x", 14) + '</button></div>';
    }).join("");
    return '<div class="cart-list">' + head + rows + '</div>';
  }

  function renderNovoPedido() {
    var vacinasOpts = state.settings.vacinas.map(function (v) { var e = estoqueVacina(v); return '<option value="' + esc(v) + '">' + esc(v) + ' — ' + e.valido + ' em estoque</option>'; }).join("");
    return '<div><div class="page-head"><div><h1>Novo pedido</h1><p>Registre a solicitação de vacinas de uma unidade de saúde.</p></div></div>' +

      '<form class="panel" id="pedidoForm"><h3>Dados da solicitação</h3><div class="form-grid">' +

      '</div><p class="field-error" id="err-pedido" style="margin-top:6px"></p>' +

  }

  function bindNovoPedidoEvents() {
    var vacSel = document.getElementById("p-vacina"), qtyInp = document.getElementById("p-quantidade");
    function mostrarEstoque() {
      var info = document.getElementById("p-estoque-info");
      if (!info) return;
      var q = parseInt(qtyInp.value, 10);
      info.innerHTML = vacSel.value ? estoqueTagHtml(vacSel.value, q > 0 ? q : null) : "";
    }
    if (vacSel) { vacSel.addEventListener("change", mostrarEstoque); qtyInp.addEventListener("input", mostrarEstoque); }
    var itemForm = document.getElementById("pedidoItemForm");
    if (itemForm) {
      itemForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var errEl = document.getElementById("err-pedido-item");
        errEl.textContent = "";
        var sel = document.getElementById("p-vacina");
        var q = parseInt(document.getElementById("p-quantidade").value, 10);
        if (!sel.value) { errEl.textContent = "Selecione uma vacina."; return; }
        if (!q || q <= 0) { errEl.textContent = "Informe uma quantidade válida."; return; }
        var existing = pedidoCart.find(function (it) { return it.nome === sel.value; });
        if (existing) existing.quantidade += q;
        else pedidoCart.push({ nome: sel.value, quantidade: q });
        renderMain();
      });
    }
    var mainForm = document.getElementById("pedidoForm");
    if (mainForm) {
      mainForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var errEl = document.getElementById("err-pedido");
        document.getElementById("err-unidade").textContent = "";
        errEl.textContent = "";

  // ---------------- estoque diário ----------------
  function movKind(tipo) { return tipo === "entrada" ? "entrada" : tipo === "saida" ? "saida" : tipo === "remessa" ? "remessa" : "descarte"; }
  function fmtDateLong(dateStr) {
    var p = dateStr.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  }

  // Reconstrói o saldo de cada dia a partir do estoque atual, desfazendo as movimentações posteriores.
  function buildDaily(dateStr) {
    var names = {}, cur = {}, per = {};
    state.batches.forEach(function (b) { names[b.nome] = true; cur[b.nome] = (cur[b.nome] || 0) + b.quantidade; });
    state.movements.forEach(function (m) { names[m.vacinaNome] = true; });
    Object.keys(names).forEach(function (n) { per[n] = { entrada: 0, saida: 0, remessa: 0, descarte: 0, afterNet: 0 }; });
    state.movements.forEach(function (m) {
      var ld = localDateOf(m.data), k = movKind(m.tipo), q = m.quantidade;
      var net = k === "entrada" ? q : -q;
      if (ld > dateStr) per[m.vacinaNome].afterNet += net;
      else if (ld === dateStr) per[m.vacinaNome][k] += q;
    });
    var rows = [];
    Object.keys(names).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); }).forEach(function (n) {
      var r = per[n];
      var closing = (cur[n] || 0) - r.afterNet;
      var dayNet = r.entrada - r.saida - r.remessa - r.descarte;
      var opening = closing - dayNet;
      if (closing === 0 && opening === 0 && r.entrada + r.saida + r.remessa + r.descarte === 0) return;
      rows.push({ nome: n, inicial: opening, entrada: r.entrada, saida: r.saida, remessa: r.remessa, descarte: r.descarte, final: closing });
    });
    var tot = rows.reduce(function (t, r) {
      t.inicial += r.inicial; t.entrada += r.entrada; t.saida += r.saida; t.remessa += r.remessa; t.descarte += r.descarte; t.final += r.final; return t;
    }, { inicial: 0, entrada: 0, saida: 0, remessa: 0, descarte: 0, final: 0 });
    return { rows: rows, total: tot };
  }

  function buildDailySeries(days) {
    var today = todayISO();
    var buckets = {};
    state.movements.forEach(function (m) {
      var ld = localDateOf(m.data);
      if (!buckets[ld]) buckets[ld] = { entrada: 0, saida: 0, remessa: 0, descarte: 0 };
      buckets[ld][movKind(m.tipo)] += m.quantidade;
    });
    var saldo = state.batches.reduce(function (s, b) { return s + b.quantidade; }, 0);
    // movimentações com data futura (relógio ajustado) são desfeitas já no saldo de hoje
    Object.keys(buckets).forEach(function (d) {
      if (d > today) { var b = buckets[d]; saldo -= (b.entrada - b.saida - b.remessa - b.descarte); }
    });
    var series = [];
    var d = today;
    for (var i = 0; i < days; i++) {
      var b = buckets[d] || { entrada: 0, saida: 0, remessa: 0, descarte: 0 };
      series.push({ date: d, entrada: b.entrada, saida: b.saida, remessa: b.remessa, descarte: b.descarte, saldo: saldo });
      saldo -= (b.entrada - b.saida - b.remessa - b.descarte);
      d = addDays(d, -1);
    }
    return series; // do dia mais recente para o mais antigo
  }

        '</div></div>';

    var lotTable = lotData.lotRows.length === 0 ? '<div class="empty" style="padding:24px 0"><p>Nenhum lote com saldo ou movimentação neste dia.</p></div>' :
      repTable("lotd", true, [["Vacina", "l"], ["Lote", "l"], ["Fabricante", "l"], ["Validade", "l"], ["Inicial", "r"], ["Entradas", "r"], ["Total saídas", "r"], ["Final", "r"]],
        lotData.lotRows.map(function (l) {
          return [esc(l.nome), '<span class="lot-chip">' + esc(l.lote) + '</span>', esc(l.fabricante), dailyValidadeCell(l), l.inicial, l.entrada || "–", dailySaidaCell(l), "<strong>" + l.final + "</strong>"];
        }),
        ["Total", "", "", "", lotData.lotTotal.inicial, lotData.lotTotal.entrada, lotData.lotTotal.saida + lotData.lotTotal.remessa + lotData.lotTotal.descarte, lotData.lotTotal.final]);

    var hist = '<div class="table-scroll"><div class="daily-table">' +
      '<div class="daily-row hist head"><div>Data</div><div class="num-cell">Entradas</div><div class="num-cell">Saídas</div><div class="num-cell">Remessas</div><div class="num-cell">Descartes</div><div>Saldo final</div></div>' +
      series.map(function (r) {

          '<div class="mono" style="font-size:12px">' + fmtDate(r.date) + '</div>' +
          '<div class="num-cell">' + (r.entrada || "–") + '</div><div class="num-cell">' + (r.saida || "–") + '</div><div class="num-cell">' + (r.remessa || "–") + '</div><div class="num-cell">' + (r.descarte || "–") + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px"><div class="bar-track" style="flex:1"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="mono" style="min-width:36px;text-align:right">' + r.saldo + '</span></div></div>';
      }).join("") + '</div></div>';

    return '<div><div class="page-head"><div><h1>Estoque diário</h1><p>Posição do estoque dia a dia: vacinas, lotes, validades, saldo por lote, entradas e saídas.</p></div>' +
      '<div class="head-actions"><button class="btn secondary" data-daily="excel">' + icon("download", 15) + ' Excel</button>' +
      '<button class="btn secondary" data-daily="pdf">' + icon("file", 15) + ' PDF</button></div></div>' +
      '<div class="date-bar"><button class="icon-btn" data-daily="prev" title="Dia anterior">' + icon("chevL", 14) + '</button>' +
      '<input type="date" id="dailyDate" value="' + date + '" max="' + today + '">' +
      '<button class="icon-btn" data-daily="next" title="Próximo dia"' + (date >= today ? ' style="opacity:.4;pointer-events:none"' : "") + '>' + icon("chevR", 14) + '</button>' +

      '<div class="panel"><h2>Resumo por vacina — ' + fmtDate(date) + '</h2>' + table + '</div>' +
      '<div class="panel"><h2>Últimos 30 dias</h2><p style="margin:-6px 0 12px;font-size:12.5px;color:var(--ink-soft)">Clique em um dia para ver o detalhamento por vacina.</p>' + hist + '</div></div>';
  }

  function dailyValidadeCell(l) {
    if (!l.validade) return "—";
    var txt = fmtDate(l.validade);
    if (l.final > 0) {
      var d = daysUntil(l.validade);
      if (d < 0) return '<span class="neg"><strong>' + txt + '</strong><span class="sub-line">vencido</span></span>';
      if (d <= 30) return '<span style="color:#96650E"><strong>' + txt + '</strong><span class="sub-line">vence em ' + d + 'd</span></span>';
    }
    return txt;
  }
  function dailySaidaCell(l) {
    var tot = l.saida + l.remessa + l.descarte;
    if (!tot) return "–";
    var parts = [];
    if (l.saida) parts.push(l.saida + " saídas");
    if (l.remessa) parts.push(l.remessa + " rem.");
    if (l.descarte) parts.push(l.descarte + " desc.");
    return "<strong>" + tot + '</strong><span class="sub-line">' + parts.join(" · ") + "</span>";
  }
  function validadeSituacao(l) {
    if (!l.validade) return "—";
    if (l.final <= 0) return "Sem saldo";
    var d = daysUntil(l.validade);
    return d < 0 ? "Vencido" : d <= 30 ? "Vence em " + d + "d" : "Regular";
  }

    doc.setFontSize(10);
    doc.setTextColor(90);
    doc.text("Posição em " + fmtDate(date) + "   ·   Gerado em " + new Date().toLocaleString("pt-BR"), 14, 21);

    var right = function (n) { var o = {}; for (var i = 0; i < n.length; i++) o[n[i]] = { halign: "right" }; return o; };
    var common = { styles: { fontSize: 8.5, cellPadding: 2.5 }, headStyles: { fillColor: [10, 42, 107] }, footStyles: { fillColor: [232, 238, 249], textColor: [6, 27, 74], fontStyle: "bold" }, theme: "striped" };
    var y = 27;
    function title(txt) {
      if (y > H - 40) { doc.addPage(); y = 16; }

    }

      doc.autoTable(Object.assign({ startY: y }, common, opts));
      y = doc.lastAutoTable.finalY + 9;

  // ---------------- relatórios ----------------
  function repState() {
    if (!state.report) {
      var t = todayISO();
      state.report = { start: addDays(t, -6), end: t, vac: "todas", secLote: true, secDia: true, secMov: false };
    }
    return state.report;
  }
  function repNormalize(r) {
    var today = todayISO(), capped = false;
    if (r.end > today) r.end = today;
    if (r.start > today) r.start = today;
    if (r.start > r.end) r.start = r.end;
    var minStart = addDays(r.end, -365);
    if (r.start < minStart) { r.start = minStart; capped = true; }
    return capped;
  }
  function repPeriodLabel(r) { return r.start === r.end ? fmtDate(r.start) : fmtDate(r.start) + " a " + fmtDate(r.end); }
  function repVacLabel(r) { return r.vac === "todas" ? "Todas as vacinas" : r.vac; }

  // Monta o relatório de um período. Os saldos são reconstruídos a partir do estoque atual,
  // desfazendo as movimentações posteriores ao fim do período.
  function buildRelatorio(r) {
    var start = r.start, end = r.end, vac = r.vac;
    var lots = {};
    function lotOf(id, nome, lote) {
      if (!lots[id]) lots[id] = { id: id, nome: nome, lote: lote, fabricante: "—", validade: "", cur: 0, entrada: 0, saida: 0, remessa: 0, descarte: 0, afterNet: 0 };
      return lots[id];
    }
    state.batches.forEach(function (b) {
      var l = lotOf(b.id, b.nome, b.lote);
      l.fabricante = b.fabricante; l.validade = b.validade; l.cur = b.quantidade;
    });
    var buckets = {}, movs = [], afterNetTotal = 0;
    state.movements.forEach(function (m) {
      if (vac !== "todas" && m.vacinaNome !== vac) return;
      var l = lotOf(m.batchId, m.vacinaNome, m.lote);
      var ld = localDateOf(m.data), k = movKind(m.tipo), q = m.quantidade;
      var net = k === "entrada" ? q : -q;
      if (ld > end) { l.afterNet += net; afterNetTotal += net; }
      else if (ld >= start) {
        l[k] += q; movs.push(m);
        if (!buckets[ld]) buckets[ld] = { entrada: 0, saida: 0, remessa: 0, descarte: 0 };
        buckets[ld][k] += q;
      }
    });

    var curTotal = 0, lotRows = [];
    Object.keys(lots).forEach(function (id) {
      var l = lots[id];
      if (vac !== "todas" && l.nome !== vac) return;
      curTotal += l.cur;
      var closing = l.cur - l.afterNet;
      var net = l.entrada - l.saida - l.remessa - l.descarte;
      var opening = closing - net;
      if (closing === 0 && opening === 0 && l.entrada + l.saida + l.remessa + l.descarte === 0) return;
      lotRows.push({ nome: l.nome, lote: l.lote, fabricante: l.fabricante, validade: l.validade, inicial: opening, entrada: l.entrada, saida: l.saida, remessa: l.remessa, descarte: l.descarte, final: closing });
    });
    lotRows.sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR") || String(a.lote).localeCompare(String(b.lote), "pt-BR"); });

    var vacMap = {};
    lotRows.forEach(function (l) {
      var v = vacMap[l.nome] || (vacMap[l.nome] = { nome: l.nome, inicial: 0, entrada: 0, saida: 0, remessa: 0, descarte: 0, final: 0 });
      ["inicial", "entrada", "saida", "remessa", "descarte", "final"].forEach(function (k) { v[k] += l[k]; });
    });
    var vacRows = Object.keys(vacMap).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); }).map(function (n) { return vacMap[n]; });
    function sumRows(rows) {
      return rows.reduce(function (t, x) {
        ["inicial", "entrada", "saida", "remessa", "descarte", "final"].forEach(function (k) { t[k] += x[k]; });
        return t;
      }, { inicial: 0, entrada: 0, saida: 0, remessa: 0, descarte: 0, final: 0 });
    }

    var dayRows = [], saldo = curTotal - afterNetTotal, d = end;
    while (d >= start) {
      var b = buckets[d] || { entrada: 0, saida: 0, remessa: 0, descarte: 0 };
      dayRows.push({ date: d, entrada: b.entrada, saida: b.saida, remessa: b.remessa, descarte: b.descarte, saldo: saldo });
      saldo -= (b.entrada - b.saida - b.remessa - b.descarte);
      d = addDays(d, -1);
    }
    dayRows.reverse();
    movs.sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });

    return { vacRows: vacRows, lotRows: lotRows, dayRows: dayRows, movs: movs, total: sumRows(vacRows), lotTotal: sumRows(lotRows) };
  }

  // ---------------- movimento diário por vacina ----------------
  function mdState() {
    if (!state.md) { var t = todayISO(); state.md = { start: addDays(t, -6), end: t, vac: "todas", det: true, view: "matriz" }; }
    return state.md;
  }
  function mdNormalize(r) {
    var today = todayISO(), capped = false;
    if (r.end > today) r.end = today;
    if (r.start > today) r.start = today;
    if (r.start > r.end) r.start = r.end;
    var minStart = addDays(r.end, -30);
    if (r.start < minStart) { r.start = minStart; capped = true; }
    return capped;
  }
  // Para cada vacina (e lote, se detalhado) e cada dia: entradas, saídas (saída + remessa + descarte) e saldo ao fim do dia.
  // O saldo é reconstruído a partir do estoque atual, desfazendo as movimentações posteriores.
  function buildMapaDia(r) {
    var days = [], d = r.start;
    while (d <= r.end) { days.push(d); d = addDays(d, 1); }
    var det = r.det !== false;
    var keys = {}, cur = {}, byKey = {};
    function reg(nome, lote) {
      var k = det ? nome + "\u0001" + (lote || "") : nome;
      if (!keys[k]) keys[k] = { nome: nome, lote: det ? (lote || "") : "" };
      return k;
    }
    if (!det) state.settings.vacinas.forEach(function (n) { reg(n, ""); });
    state.batches.forEach(function (b) { var k = reg(b.nome, b.lote); cur[k] = (cur[k] || 0) + b.quantidade; });
    state.movements.forEach(function (m) {
      var k = reg(m.vacinaNome, m.lote);
      (byKey[k] = byKey[k] || []).push({ d: localDateOf(m.data), net: m.tipo === "entrada" ? m.quantidade : -m.quantidade, ent: m.tipo === "entrada" ? m.quantidade : 0, sai: m.tipo === "entrada" ? 0 : m.quantidade });
    });
    var rows = [];
    Object.keys(keys).sort(function (a, b) {
      var x = keys[a], y = keys[b];
      return x.nome.localeCompare(y.nome, "pt-BR") || x.lote.localeCompare(y.lote, "pt-BR", { numeric: true });
    }).forEach(function (k) {
      var info = keys[k];
      if (r.vac !== "todas" && r.vac !== info.nome) return;
      var movs = byKey[k] || [], cells = [], any = false;
      days.forEach(function (day) {
        var ent = 0, sai = 0, after = 0;
        movs.forEach(function (m) { if (m.d === day) { ent += m.ent; sai += m.sai; } if (m.d > day) after += m.net; });
        var saldo = (cur[k] || 0) - after;
        if (ent || sai || saldo) any = true;
        cells.push({ ent: ent, sai: sai, saldo: saldo });
      });
      if (any) rows.push({ nome: info.nome, lote: info.lote, cells: cells });
    });
    var tot = days.map(function (_, i) {
      return rows.reduce(function (t, x) { t.ent += x.cells[i].ent; t.sai += x.cells[i].sai; t.saldo += x.cells[i].saldo; return t; }, { ent: 0, sai: 0, saldo: 0 });
    });
    // lista detalhada: uma linha por dia com movimento, para cada vacina/lote
    var lista = [];
    days.forEach(function (day, i) {
      rows.forEach(function (x) {
        var c = x.cells[i];
        if (c.ent || c.sai) lista.push({ dia: day, nome: x.nome, lote: x.lote, ent: c.ent, sai: c.sai, saldo: c.saldo });
      });
    });
    return { days: days, rows: rows, tot: tot, lista: lista, det: det };
  }
  function mdShort(day) { var p = day.split("-"); return p[2] + "/" + p[1]; }
  function mdLabel(r) { return (r.start === r.end ? fmtDate(r.start) : fmtDate(r.start) + " a " + fmtDate(r.end)) + " · " + (r.vac === "todas" ? "Todas as vacinas" : r.vac); }

      var h2 = '<tr class="sub">' + data.days.map(function () { return '<th class="daygrp" style="border-left:2px solid var(--teal)">Entr.</th><th>Saíd.</th><th>Saldo</th>'; }).join("") + '</tr>';
      var body = data.rows.map(function (x) {

          return '<td class="dstart' + (c.ent ? " pos" : "") + '">' + (c.ent ? "+" + c.ent : "–") + '</td><td' + (c.sai ? ' class="neg"' : "") + '>' + (c.sai ? "−" + c.sai : "–") + '</td><td class="saldo">' + c.saldo + '</td>';
        }).join("") + '</tr>';
      }).join("");
      var foot = '<tr class="tot"><td class="first" style="background:var(--ice-soft)"' + (det ? "" : "") + '>Total</td>' + (det ? '<td class="second" style="background:var(--ice-soft)"></td>' : '') + data.tot.map(function (c) {
        return '<td class="dstart">' + c.ent + '</td><td>' + c.sai + '</td><td>' + c.saldo + '</td>';
      }).join("") + '</tr>';
      table = '<div class="mapa-wrap"><table class="mapa"><thead>' + h1 + h2 + '</thead><tbody>' + body + foot + '</tbody></table></div>' +
        '<p class="rep-note">Saídas incluem saídas de frascos, remessas e descartes. O saldo é o de fim de dia, calculado a partir do estoque atual e das movimentações registradas.</p>';
