  // ---------------- consumo médio e previsão ----------------
  function cpState() {
    if (!state.cp) state.cp = { win: 30, hor: 30, vac: "todas" };
    return state.cp;
  }
  function cpNum(n, dec) { return Number(n).toLocaleString("pt-BR", { maximumFractionDigits: dec == null ? 1 : dec }); }

  // Consumo = saídas de frascos + remessas (descartes ficam de fora e aparecem à parte).
  // Média = consumo ÷ dias com histórico (no máximo a janela escolhida).
  // Previsão = média diária × horizonte. Cobertura = estoque utilizável (sem vencidos) ÷ média diária.
  function buildConsumo(c) {
    var today = todayISO(), N = c.win, H = c.hor;
    var start = addDays(today, -(N - 1));
    var days = []; for (var i = 0; i < N; i++) days.push(addDays(start, i));
    var names = {};
    state.settings.vacinas.forEach(function (n) { names[n] = true; });
    state.batches.forEach(function (b) { names[b.nome] = true; });
    state.movements.forEach(function (m) { names[m.vacinaNome] = true; });
    var rows = [];
    Object.keys(names).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); }).forEach(function (n) {
      if (c.vac !== "todas" && c.vac !== n) return;
      var movs = state.movements.filter(function (m) { return m.vacinaNome === n; });
      var lotes = state.batches.filter(function (b) { return b.nome === n && b.quantidade > 0; });
      if (!movs.length && !lotes.length) return;

      // dias de histórico disponíveis (se a vacina é nova, divide só pelos dias existentes)
      var first = null;
      movs.forEach(function (m) { var d = localDateOf(m.data); if (!first || d < first) first = d; });
      var eff = first ? Math.max(1, Math.min(N, 1 - daysUntil(first))) : N;

      var daily = days.map(function () { return 0; }), consumo = 0, descarte = 0;
      var half = Math.floor(eff / 2), recStart = addDays(today, -(half - 1)), oldStart = addDays(recStart, -half);
      var recent = 0, older = 0;
      movs.forEach(function (m) {
        var d = localDateOf(m.data);
        if (d < start) return;
        if (m.tipo === "saida" || m.tipo === "remessa") {
          consumo += m.quantidade;
          var ix = days.indexOf(d); if (ix >= 0) daily[ix] += m.quantidade;
          if (half >= 2) { if (d >= recStart) recent += m.quantidade; else if (d >= oldStart) older += m.quantidade; }
        } else if (m.tipo === "descarte") descarte += m.quantidade;
      });

      var rate = consumo / eff;
      var utilizaveis = lotes.filter(function (b) { return daysUntil(b.validade) >= 0; });
      var estoque = utilizaveis.reduce(function (t, b) { return t + b.quantidade; }, 0);
      var vencidos = lotes.reduce(function (t, b) { return t + (daysUntil(b.validade) < 0 ? b.quantidade : 0); }, 0);
      var cobertura = rate > 0 ? estoque / rate : null;
      var esgota = cobertura != null ? addDays(today, Math.floor(cobertura)) : null;
      var previsao = Math.ceil(rate * H - 1e-9);
      var repor = Math.max(0, previsao - estoque);

      // Risco de vencer sem uso: consome primeiro os lotes que vencem antes (FEFO) no ritmo médio atual.
      var risco = null;
      if (rate > 0) {
        var cum = 0, perda = 0;
        utilizaveis.slice().sort(function (a, b) { return a.validade < b.validade ? -1 : 1; }).forEach(function (l) {
          var cap = rate * Math.max(0, daysUntil(l.validade));
          var cons = Math.min(l.quantidade, Math.max(0, cap - cum));
          cum += cons; perda += l.quantidade - cons;
        });
        risco = Math.round(perda);
      }
      var tend = null;                          // variação % da metade recente contra a anterior
      if (half >= 2 && older > 0) tend = (recent - older) / older * 100;
      else if (half >= 2 && older === 0 && recent > 0) tend = Infinity;
      rows.push({ nome: n, estoque: estoque, vencidos: vencidos, consumo: consumo, eff: eff, rate: rate, sem: rate * 7, mes: rate * 30,
        tend: tend, cobertura: cobertura, esgota: esgota, previsao: previsao, repor: repor, risco: risco, descarte: descarte, daily: daily });
    });
    return { days: days, rows: rows, win: N, hor: H };
  }
  function cpTend(t) {
    if (t === null) return "—";
    if (t === Infinity) return "↑ novo";
    if (t > 10) return "↑ +" + cpNum(t, 0) + "%";
    if (t < -10) return "↓ " + cpNum(t, 0) + "%";
    return "→ estável";
  }
  function cpCobTxt(r) { return r.cobertura == null ? "sem consumo" : cpNum(r.cobertura, 0) + " d"; }

  function renderConsumo() {
    var c = cpState();
    var data = buildConsumo(c);
    var names = {};
    state.settings.vacinas.forEach(function (n) { names[n] = true; });
    state.batches.forEach(function (b) { names[b.nome] = true; });
    state.movements.forEach(function (m) { names[m.vacinaNome] = true; });
    var vacOpts = '<option value="todas"' + (c.vac === "todas" ? " selected" : "") + '>Todas as vacinas</option>' +
      Object.keys(names).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); }).map(function (n) {
        return '<option value="' + esc(n) + '"' + (c.vac === n ? " selected" : "") + '>' + esc(n) + '</option>';
      }).join("");
    function chips(prefix, cur) {
      return [7, 15, 30, 60, 90].map(function (d) { return '<button class="chip-filter' + (cur === d ? " active" : "") + '" data-cp="' + prefix + d + '">' + d + ' dias</button>'; }).join("");
    }
    var controls = '<div class="panel no-print"><h3>Parâmetros</h3>' +
      '<div class="presets"><span style="font-size:12px;color:var(--ink-soft);align-self:center">Base do consumo (últimos):</span>' + chips("w", c.win) + '</div>' +
      '<div class="presets" style="margin-top:8px"><span style="font-size:12px;color:var(--ink-soft);align-self:center">Previsão para os próximos:</span>' + chips("h", c.hor) + '</div>' +
      '<div class="form-grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><div class="field"><label>Vacina</label><select id="cpVac">' + vacOpts + '</select></div></div></div>';

    var totC = 0, totR = 0, crit = 0;
    data.rows.forEach(function (r) { totC += r.consumo; totR += r.repor; if (r.cobertura != null && r.cobertura <= 15) crit++; });
    var cards = '<div class="grid-cards">' +
      '<div class="stat-card"><div class="num mono">' + totC + '</div><div class="lbl">Frascos consumidos (' + c.win + ' dias)</div></div>' +
      '<div class="stat-card"><div class="num mono">' + (data.rows.length ? cpNum(totC / c.win) : 0) + '</div><div class="lbl">Média geral por dia (frascos)</div></div>' +
      '<div class="stat-card"><div class="num mono">' + crit + '</div><div class="lbl">Vacinas com cobertura até 15 dias</div></div>' +
      '<div class="stat-card"><div class="num mono">' + totR + '</div><div class="lbl">Frascos a repor (' + c.hor + ' dias)</div></div></div>';

    var table;
    if (!data.rows.length) table = repEmpty("Sem vacinas ou movimentações para analisar.");
    else {
      var heads = ["Estoque (frascos)", "Vencidos", "Consumo (" + c.win + " d)", "Dias de base", "Média/dia", "Média/semana", "Média/mês", "Tendência", "Cobertura", "Esgota em", "Previsão (" + c.hor + " d)", "Repor", "Risco de vencer", "Descartes"];
      var body = data.rows.map(function (r) {
        var cobCls = r.cobertura == null ? "" : r.cobertura <= 7 ? ' class="neg"' : r.cobertura <= 15 ? ' style="color:var(--amber);font-weight:700"' : ' class="pos"';
        return '<tr><td class="first">' + esc(r.nome) + '</td><td class="saldo">' + r.estoque + '</td><td' + (r.vencidos ? ' class="neg"' : "") + '>' + (r.vencidos || "–") + '</td><td>' + r.consumo + '</td><td>' + r.eff + '</td><td>' + cpNum(r.rate, 2) + '</td><td>' + cpNum(r.sem) + '</td><td>' + cpNum(r.mes, 0) + '</td><td>' + cpTend(r.tend) + '</td>' +
          '<td' + cobCls + '>' + cpCobTxt(r) + '</td><td>' + (r.esgota ? fmtDate(r.esgota) : "—") + '</td><td>' + r.previsao + '</td><td' + (r.repor ? ' class="neg"' : "") + '>' + (r.repor || "–") + '</td><td' + (r.risco ? ' class="neg"' : "") + '>' + (r.risco == null ? "—" : (r.risco || "–")) + '</td><td>' + (r.descarte || "–") + '</td></tr>';
      }).join("");
      table = '<div class="mapa-wrap"><table class="mapa"><thead><tr><th class="first">Vacina</th>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<p class="rep-note">Consumo = saídas de frascos e remessas (descartes à parte). Média = consumo ÷ dias com histórico (até ' + c.win + '). Previsão = média diária × ' + c.hor + ' dias. Cobertura = estoque utilizável (sem lotes vencidos) ÷ média diária. Repor = previsão − estoque utilizável. Risco de vencer = frascos que não seriam consumidos antes da validade, usando primeiro os lotes que vencem antes e o ritmo médio atual. A tendência compara a metade mais recente do período com a anterior. É uma estimativa baseada no histórico: não considera campanhas nem sazonalidade.</p>';
    }
    return '<div><div class="page-head"><div><h1>Consumo médio e previsão</h1><p>Quanto cada vacina é consumida, por quanto tempo o estoque dura e quanto deve ser usado nos próximos dias.</p></div>' +
      '<div class="head-actions"><button class="btn secondary" data-cp="excel">' + icon("download", 15) + ' Excel</button>' +
      '<button class="btn" data-cp="pdf">' + icon("file", 15) + ' PDF</button></div></div>' + controls + cards +
      '<div class="panel"><h2>Base de ' + c.win + ' dias · previsão de ' + c.hor + ' dias</h2>' + table + '</div></div>';
  }

  function cpFileBase(c) { return "imunostock_consumo_previsao_" + todayISO() + "_base" + c.win + "d"; }
  function cpRowArr(r) {
    return [r.nome, r.estoque, r.vencidos, r.consumo, r.eff, Number(r.rate.toFixed(2)), Number(r.sem.toFixed(1)), Math.round(r.mes),
      cpTend(r.tend), r.cobertura == null ? "sem consumo" : Math.round(r.cobertura), r.esgota ? fmtDate(r.esgota) : "—", r.previsao, r.repor, r.risco == null ? "—" : r.risco, r.descarte];
  }
  function cpHeads(c) {
    return ["Vacina", "Estoque utilizável (frascos)", "Vencidos (frascos)", "Consumo (" + c.win + " d)", "Dias de base", "Média/dia", "Média/semana", "Média/mês (30 d)", "Tendência", "Cobertura (dias)", "Esgota em", "Previsão (" + c.hor + " d)", "Repor (frascos)", "Risco de vencer (frascos)", "Descartes (" + c.win + " d)"];
  }

  function exportConsumoExcel() {
    var c = cpState(), data = buildConsumo(c);
    var aoa = [["ImunoStock — Consumo médio e previsão (frascos)"], ["Base do consumo", c.win + " dias"], ["Previsão para", c.hor + " dias"], ["Gerado em", new Date().toLocaleString("pt-BR")], [],
      cpHeads(c)];
    data.rows.forEach(function (r) { aoa.push(cpRowArr(r)); });
    aoa.push([]);
    aoa.push(["Consumo = saídas de frascos e remessas (descartes à parte). Média = consumo ÷ dias com histórico. Previsão = média diária × horizonte. Cobertura = estoque utilizável ÷ média diária. Estimativa baseada no histórico."]);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = cpHeads(c).map(function (h, i) { return { wch: i === 0 ? 30 : 16 }; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Consumo e previsão");
    var dh = ["Vacina"].concat(data.days.map(function (d) { return fmtDate(d); })).concat(["Total"]);
    var drows = data.rows.map(function (r) { return [r.nome].concat(r.daily).concat([r.consumo]); });
    var ws2 = XLSX.utils.aoa_to_sheet([dh].concat(drows));
    ws2["!cols"] = dh.map(function (h, i) { return { wch: i === 0 ? 30 : 11 }; });
    XLSX.utils.book_append_sheet(wb, ws2, "Saídas por dia");
    XLSX.writeFile(wb, cpFileBase(c) + ".xlsx");
  }

  function exportConsumoPDF() {
    var c = cpState(), data = buildConsumo(c);
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ orientation: "landscape" });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setFontSize(16); doc.setTextColor(10, 42, 107);
    doc.text("ImunoStock — Consumo médio e previsão (frascos)", 14, 15);
    doc.setFontSize(10); doc.setTextColor(90);
    doc.text("Base: últimos " + c.win + " dias   ·   Previsão: próximos " + c.hor + " dias   ·   Gerado em " + new Date().toLocaleString("pt-BR"), 14, 21);
    if (!data.rows.length) { doc.setTextColor(30); doc.text("Sem vacinas ou movimentações para analisar.", 14, 32); }
    else {
      var cs = {}; for (var j = 1; j <= 14; j++) cs[j] = { halign: "right" };
      doc.autoTable({
        startY: 26,
        head: [["Vacina", "Estoque", "Venc.", "Consumo", "Dias base", "Média/dia", "Média/sem.", "Média/mês", "Tendência", "Cobertura", "Esgota em", "Prev. " + c.hor + "d", "Repor", "Risco venc.", "Descartes"]],
        body: data.rows.map(function (r) {
          return [r.nome, r.estoque, r.vencidos || "–", r.consumo, r.eff, cpNum(r.rate, 2), cpNum(r.sem), cpNum(r.mes, 0), cpTend(r.tend), cpCobTxt(r), r.esgota ? fmtDate(r.esgota) : "—", r.previsao, r.repor || "–", r.risco == null ? "—" : (r.risco || "–"), r.descarte || "–"];
        }),
        columnStyles: cs, styles: { fontSize: 7, cellPadding: 1.8 }, headStyles: { fillColor: [10, 42, 107] }, theme: "grid"
      });
      var y = doc.lastAutoTable.finalY + 8;
      doc.setFontSize(7.5); doc.setTextColor(110);
      var note = doc.splitTextToSize("Consumo = saídas de frascos e remessas (descartes à parte). Média = consumo ÷ dias com histórico (até " + c.win + "). Previsão = média diária × " + c.hor + " dias. Cobertura = estoque utilizável (sem vencidos) ÷ média diária. Repor = previsão − estoque utilizável. Risco de vencer = frascos que não seriam consumidos antes da validade (lotes que vencem antes saem primeiro). Estimativa baseada no histórico; não considera campanhas nem sazonalidade.", W - 28);
      if (y + note.length * 3.5 > H - 10) { doc.addPage(); y = 16; }
      doc.text(note, 14, y);
    }
    var n = doc.internal.getNumberOfPages();
    for (var i2 = 1; i2 <= n; i2++) { doc.setPage(i2); doc.setFontSize(8); doc.setTextColor(120); doc.text("Página " + i2 + " de " + n, W - 14, H - 7, { align: "right" }); }
    doc.save(cpFileBase(c) + ".pdf");
  }

  // ---------------- router / render ----------------
  function renderMain() {
    var main = document.getElementById("main");
    if (!main) return;
    var html = "";
    if (state.page === "dashboard") html = renderDashboard();
    else if (state.page === "estoque") html = renderEstoque();
    else if (state.page === "diario") html = renderDiario();
    else if (state.page === "relatorios") html = renderRelatorios();
    else if (state.page === "mapadia") html = renderMapaDia();
    else if (state.page === "consumo") html = renderConsumo();
    else if (state.page === "entrada") html = renderEntrada();
    else if (state.page === "saida") html = renderSaida();
    else if (state.page === "remessa") html = renderRemessa();
    else if (state.page === "pedidos") html = renderPedidos();
    else if (state.page === "novo-pedido") html = renderNovoPedido();
    else if (state.page === "confirmar-pedido") html = renderConfirmarPedido();
    else if (state.page === "historico") html = renderHistorico();
    else if (state.page === "config") html = renderConfig();
    main.innerHTML = html;
    if (state.page === "entrada") bindEntradaEvents();
    if (state.page === "saida") bindSaidaEvents();
    if (state.page === "remessa") bindRemessaEvents();
    if (state.page === "novo-pedido") bindNovoPedidoEvents();
    if (state.page === "confirmar-pedido") bindConfirmarPedidoEvents();
    if (state.page === "config") bindConfigEvents();
    var sidebar = document.querySelector(".sidebar");
    if (sidebar) {
      sidebar.querySelectorAll("[data-nav]").forEach(function (btn) {
        btn.classList.toggle("active", navActive(btn.getAttribute("data-nav")));
      });
      var footer = sidebar.querySelector(".sidebar-foot");
      updateFileBadge();
      if (footer) footer.textContent = state.batches.length + " lote" + (state.batches.length !== 1 ? "s" : "") + " cadastrado" + (state.batches.length !== 1 ? "s" : "");
    }
  }

  function renderApp() {
    if (!state.ready) {
      root.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Carregando estoque…</div>';
      return;
    }
    root.innerHTML = '<div class="app">' + renderSidebar() + '<main class="main" id="main"></main></div>';
    renderMain();
  }

  // ---------------- global delegated events ----------------
  document.addEventListener("click", function (e) {
    var navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      var nextPage = navBtn.getAttribute("data-nav");
      if (state.page === "remessa" && nextPage !== "remessa" && remessaCart.length > 0) {
        if (!confirm("Você tem itens não enviados na guia de remessa atual. Sair mesmo assim? Os itens serão descartados.")) return;
        remessaCart = [];
      }
      if (state.page === "novo-pedido" && nextPage !== "novo-pedido" && pedidoCart.length > 0) {
        if (!confirm("Você tem itens não salvos neste pedido. Sair mesmo assim? Os itens serão descartados.")) return;
        pedidoCart = [];
      }
      if (state.page === "confirmar-pedido" && nextPage !== "confirmar-pedido" && hasConfirmCartEntries()) {
        if (!confirm("Você tem itens selecionados para envio ainda não confirmados. Sair mesmo assim?")) return;
        confirmCart = {};
        confirmandoPedidoId = null;
      }
      state.page = nextPage;
      renderMain();
      document.querySelectorAll("[data-nav]").forEach(function (b) { b.classList.toggle("active", navActive(b.getAttribute("data-nav"))); });
      window.scrollTo(0, 0);
      return;
    }

    var actionEl = e.target.closest("[data-action]");
    if (actionEl) {
      var action = actionEl.getAttribute("data-action");
      if (action === "export-excel") return exportExcel(state.batches, state.movements);
      if (action === "export-pdf") return exportPDF(state.batches, state.movements);
      if (action === "etiqueta") {
        var eb = state.batches.find(function (x) { return x.id === actionEl.getAttribute("data-id"); });
        if (!eb) return;
        var ec = prompt("Quantas etiquetas gerar para o lote " + eb.lote + "?", "1");
        if (ec === null) return;
        var en = parseInt(ec, 10);
        if (!(en > 0)) { alert("Quantidade inválida."); return; }
        generateEtiqueta(eb, en);
        return;
      }
      if (action === "goto-config") { state.page = "config"; renderMain(); return; }
      if (action === "file-new") return fileCreateNew();
      if (action === "file-open") return fileOpenExisting();
      if (action === "file-reconnect") return fileReconnect();
      if (action === "file-reload") return fileReloadFromFile();
      if (action === "file-unlink") return fileUnlink();
      if (action === "xl-download") return xlDownload();
      if (action === "csv-export") return csvExport();
      if (action === "bk-export") return exportBackup();
      if (action === "bk-clear") return clearAllData();
      if (action === "delete-batch") return openDeleteModal(actionEl.getAttribute("data-id"));
      if (action === "quick-saida") {
        var id = actionEl.getAttribute("data-id");
        var b = state.batches.find(function (x) { return x.id === id; });
        if (!b) return;
        var q = prompt("Frascos a retirar do lote " + b.lote + " (disponível: " + b.quantidade + "):", "1");
        if (q === null) return;
        var n = parseInt(q, 10);
        if (!(n > 0 && n <= b.quantidade)) { alert("Quantidade inválida."); return; }
        var org = prompt("Unidade/estabelecimento de ORIGEM:", ultimaOrigem());
        if (org === null) return;
        if (!org.trim()) { alert("Informe a origem."); return; }
        var dst = prompt("Unidade/estabelecimento de DESTINO:", "");
        if (dst === null) return;
        if (!dst.trim()) { alert("Informe o destino."); return; }
        registerMovement(id, "saida", n, "Saída de frascos", org.trim(), dst.trim());
        updateEstoqueList();
        return;
      }
      if (action === "remove-vacina") {
        var val = actionEl.getAttribute("data-value");
        state.settings.vacinas = state.settings.vacinas.filter(function (x) { return x !== val; });
        persistSettings();
        document.getElementById("vacinasTagList").innerHTML = tagListHtml(state.settings.vacinas, "vacina");
        return;
      }
      if (action === "remove-fabricante") {
        var valF = actionEl.getAttribute("data-value");
        state.settings.fabricantes = state.settings.fabricantes.filter(function (x) { return x !== valF; });
        persistSettings();
        document.getElementById("fabricantesTagList").innerHTML = tagListHtml(state.settings.fabricantes, "fabricante");
        return;
      }
      if (action === "remove-cart-item") {
        var idx = parseInt(actionEl.getAttribute("data-idx"), 10);
        remessaCart.splice(idx, 1);
        renderMain();
        return;
      }
      if (action === "reprint-guia") {
        var gid = actionEl.getAttribute("data-id");
        var r = state.remessas.find(function (x) { return x.id === gid; });
        if (r) gerarPdf(generateGuiaPDF, r);
        return;
      }
      if (action === "pedido-pdf") {
        var pid2 = actionEl.getAttribute("data-id");
        var pp = state.pedidos.find(function (x) { return x.id === pid2; });
        if (pp) gerarPdf(generatePedidoPDF, pp);
        return;
      }
      if (action === "remove-pedido-cart-item") {
        var pidx = parseInt(actionEl.getAttribute("data-idx"), 10);
        pedidoCart.splice(pidx, 1);
        renderMain();
        return;
      }
      if (action === "confirm-pedido") {
        confirmandoPedidoId = actionEl.getAttribute("data-id");
        confirmCart = {};
        state.page = "confirmar-pedido";
        renderMain();
        window.scrollTo(0, 0);
        return;
      }
      if (action === "cancel-pedido") {
        var cpid = actionEl.getAttribute("data-id");
        if (confirm("Cancelar este pedido? Nenhum frasco será debitado do estoque.")) {
          cancelPedido(cpid);
          renderMain();
        }
        return;
      }
      if (action === "add-confirm-item") {
        var itemIdx = actionEl.getAttribute("data-item-idx");
        var errEl2 = document.getElementById("err-conf-" + itemIdx);
        errEl2.textContent = "";
        var sel2 = document.getElementById("conf-batch-" + itemIdx);
        if (!sel2 || !sel2.value) { errEl2.textContent = "Selecione um lote."; return; }
        var opt2 = sel2.options[sel2.selectedIndex];
        var max2 = parseInt(opt2.getAttribute("data-max"), 10);
        var jaAdicionado = (confirmCart[itemIdx] || []).filter(function (it) { return it.batchId === sel2.value; }).reduce(function (s, it) { return s + it.quantidade; }, 0);
        var qEl = document.getElementById("conf-qty-" + itemIdx);
        var q2 = parseInt(qEl.value, 10);
        if (!q2 || q2 <= 0) { errEl2.textContent = "Informe uma quantidade válida."; return; }
        if (q2 + jaAdicionado > max2) { errEl2.textContent = "Apenas " + (max2 - jaAdicionado) + " frascos disponíveis neste lote."; return; }
        if (!confirmCart[itemIdx]) confirmCart[itemIdx] = [];
        confirmCart[itemIdx].push({
          batchId: sel2.value, nome: opt2.getAttribute("data-nome"), fabricante: opt2.getAttribute("data-fabricante"),
          lote: opt2.getAttribute("data-lote"), validade: opt2.getAttribute("data-validade"), quantidade: q2
        });
        renderMain();
        return;
      }
      if (action === "remove-confirm-item") {
        var iIdx = actionEl.getAttribute("data-item-idx");
        var eIdx = parseInt(actionEl.getAttribute("data-entry-idx"), 10);
        if (confirmCart[iIdx]) confirmCart[iIdx].splice(eIdx, 1);
        renderMain();
        return;
      }
    }

    var cpEl = e.target.closest("[data-cp]");
    if (cpEl) {
      var ca = cpEl.getAttribute("data-cp"), cs0 = cpState();
      if (ca === "pdf") { exportConsumoPDF(); return; }
      if (ca === "excel") { exportConsumoExcel(); return; }
      if (ca.charAt(0) === "w") cs0.win = parseInt(ca.slice(1), 10);
      else if (ca.charAt(0) === "h") cs0.hor = parseInt(ca.slice(1), 10);
      renderMain();
      return;
    }

    var mdEl = e.target.closest("[data-md]");
    if (mdEl) {
      var ma = mdEl.getAttribute("data-md");
      var ms = mdState(), tdm = todayISO();
      if (ma === "pdf") { exportMapaDiaPDF(); return; }
      if (ma === "excel") { exportMapaDiaExcel(); return; }
      if (ma === "today") { ms.start = tdm; ms.end = tdm; }
      else if (ma === "7") { ms.start = addDays(tdm, -6); ms.end = tdm; }
      else if (ma === "15") { ms.start = addDays(tdm, -14); ms.end = tdm; }
      else if (ma === "month") { ms.start = tdm.slice(0, 8) + "01"; ms.end = tdm; }
      else if (ma === "det-on") ms.det = true;
      else if (ma === "det-off") ms.det = false;
      else if (ma === "view-matriz") ms.view = "matriz";
      else if (ma === "view-lista") ms.view = "lista";
      renderMain();
      return;
    }

    var repEl = e.target.closest("[data-rep]");
    if (repEl) {
      var ra = repEl.getAttribute("data-rep");
      var rs = repState(), tdy = todayISO();
      if (ra === "print") { printRelatorio(); return; }
      if (ra === "pdf") { exportRelatorioPDF(); return; }
      if (ra === "excel") { exportRelatorioExcel(); return; }
      if (ra === "today") { rs.start = tdy; rs.end = tdy; }
      else if (ra === "7") { rs.start = addDays(tdy, -6); rs.end = tdy; }
      else if (ra === "30") { rs.start = addDays(tdy, -29); rs.end = tdy; }
      else if (ra === "month") { rs.start = tdy.slice(0, 8) + "01"; rs.end = tdy; }
      renderMain();
      return;
    }

    var dailyEl = e.target.closest("[data-daily]");
    if (dailyEl) {
      var da = dailyEl.getAttribute("data-daily");
      var cur = state.dailyDate || todayISO();
      if (da === "prev") state.dailyDate = addDays(cur, -1);
      else if (da === "next") { var nx = addDays(cur, 1); state.dailyDate = nx > todayISO() ? todayISO() : nx; }
      else if (da === "today") state.dailyDate = todayISO();
      else if (da === "pick") state.dailyDate = dailyEl.getAttribute("data-date");
      else if (da === "excel") { exportDailyExcel(cur); return; }
      else if (da === "pdf") { exportDailyPDF(cur); return; }
      renderMain();
      return;
    }

    var filterEstoqueBtn = e.target.closest("[data-filter-estoque]");
    if (filterEstoqueBtn) { state.filterEstoque = filterEstoqueBtn.getAttribute("data-filter-estoque"); updateEstoqueList(); return; }

    var filterHistBtn = e.target.closest("[data-filter-historico]");
    if (filterHistBtn) { state.filterHistorico = filterHistBtn.getAttribute("data-filter-historico"); updateHistoricoList(); return; }

    var filterPedidosBtn = e.target.closest("[data-filter-pedidos]");
    if (filterPedidosBtn) { state.filterPedidos = filterPedidosBtn.getAttribute("data-filter-pedidos"); updatePedidosList(); return; }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "dailyDate" && e.target.value) {
      var v = e.target.value;
      state.dailyDate = v > todayISO() ? todayISO() : v;
      renderMain();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "xlImportFile" && e.target.files && e.target.files[0]) {
      xlImportFile(e.target.files[0]);
      e.target.value = "";
    }
    if (e.target && e.target.id === "bkImportFile" && e.target.files && e.target.files[0]) {
      importBackup(e.target.files[0]);
      e.target.value = "";
    }
  });

  document.addEventListener("change", function (e) {
    var mid = e.target && e.target.id;
    if (mid === "cpVac") { cpState().vac = e.target.value; renderMain(); return; }
    if (!mid || mid.indexOf("md") !== 0) return;
    var m = mdState();
    if (mid === "mdStart" && e.target.value) { m.start = e.target.value; if (m.start > m.end) m.end = m.start; }
    else if (mid === "mdEnd" && e.target.value) { m.end = e.target.value; if (m.end < m.start) m.start = m.end; }
    else if (mid === "mdVac") m.vac = e.target.value;
    else return;
    if (mdNormalize(m)) showToast("Período limitado a 31 dias.");
    renderMain();
  });

  document.addEventListener("change", function (e) {
    var id = e.target && e.target.id;
    if (!id || id.indexOf("rep") !== 0) return;
    var r = repState();
    if (id === "repStart" && e.target.value) { r.start = e.target.value; if (r.start > r.end) r.end = r.start; }
    else if (id === "repEnd" && e.target.value) { r.end = e.target.value; if (r.end < r.start) r.start = r.end; }
    else if (id === "repVac") r.vac = e.target.value;
    else if (id === "repSecLote") r.secLote = e.target.checked;
    else if (id === "repSecDia") r.secDia = e.target.checked;
    else if (id === "repSecMov") r.secMov = e.target.checked;
    else return;
    if (repNormalize(r)) showToast("Período limitado a 366 dias.");
    renderMain();
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "estoqueSearch") {
      state.searchEstoque = e.target.value;
      updateEstoqueList();
    }
  });

  loadAll();
})();
</script>
</body>
</html>
