<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2A6B">
<title>ImunoStock — Gestão de Estoque de Vacinas (arquivo Excel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --ink:#0A1633;
    --ink-soft:#4A5B7F;
    --teal:#0A2A6B;
    --teal-deep:#061B4A;
    --ice:#3B5BA9;
    --ice-soft:#E8EEF9;
    --amber:#E0942E;
    --amber-soft:#FCEED9;
    --danger:#C1443C;
    --danger-soft:#F8DEDB;
    --ok:#2F8F68;
    --ok-soft:#DCF0E5;
    --line:#D5DEF0;
    --radius:14px;
    --shadow:0 1px 2px rgba(6,27,74,0.06), 0 8px 24px -12px rgba(6,27,74,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  ::selection{background:var(--ice-soft);}

  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  .app{
    display:grid;
    grid-template-columns:230px 1fr;
    min-height:100vh;
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:sticky; top:0; z-index:20; grid-template-columns: none;}
  }

  .sidebar{
    background:linear-gradient(180deg,var(--teal-deep),var(--teal) 85%);
    color:#E8EEF9;
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:radial-gradient(circle at 30% 30%, #8FA6D6, #1F3F8F 70%);
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand-text{font-family:'Space Grotesk';font-weight:700;font-size:16.5px;line-height:1.1;}
  .brand-sub{font-size:10.5px;color:#A9BCE3;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}

  .nav{display:flex;flex-direction:column;gap:3px;}
  .nav button{
    all:unset;
    display:flex;align-items:center;gap:10px;
    padding:9px 11px;border-radius:9px;
    font-size:13.5px;font-weight:500;color:#C9D5EE;
    transition:background .15s ease, color .15s ease;
    width:100%;
  }
  .nav button svg{width:16px;height:16px;opacity:.85;flex-shrink:0;}
  .nav button:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav button.active{background:rgba(255,255,255,0.16);color:#fff;}

  .team-badge{
    display:flex;align-items:flex-start;gap:7px;
    font-size:10.5px;color:#E8EEF9;background:rgba(255,255,255,0.08);
    padding:8px 10px;border-radius:9px;line-height:1.4;
  }
  .team-badge svg{width:13px;height:13px;flex-shrink:0;margin-top:1px;color:#A9BCE3;}

  .sidebar-foot{
    margin-top:auto;
    font-size:11px;color:#C9D5EE;
    padding:10px 6px 0;
    border-top:1px solid rgba(255,255,255,0.12);
  }

  .main{padding:26px 30px 60px;max-width:1180px;}
  @media (max-width:820px){.main{padding:18px 16px 60px;}}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-size:23px;margin:0 0 4px;color:var(--teal-deep);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--teal);color:#fff;border:none;
    padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow);
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:var(--teal-deep);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:#fff;color:var(--teal-deep);border:1px solid var(--line);box-shadow:none;}
  .btn.secondary:hover{background:var(--ice-soft);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#9c332c;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.sm{padding:7px 12px;font-size:12.5px;}

  .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  @media (max-width:920px){.grid-cards{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-cards{grid-template-columns:1fr;}}
  .stat-card{
    background:var(--panel);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow); border:1px solid var(--line);
    position:relative; overflow:hidden;
  }
  .stat-card .num{font-family:'Space Grotesk';font-size:28px;font-weight:700;color:var(--teal-deep);}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .stat-card .tag{position:absolute;top:14px;right:14px;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
  .tag.ok{background:var(--ok-soft);color:var(--ok);}
  .tag.amber{background:var(--amber-soft);color:#96650E;}
  .tag.danger{background:var(--danger-soft);color:var(--danger);}

  .panel{
    background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);
    box-shadow:var(--shadow); padding:20px;margin-bottom:20px;
  }
  .panel h2{font-size:16px;margin:0 0 14px;color:var(--teal-deep);display:flex;align-items:center;}
  .panel h3{font-size:13.5px;margin:0 0 10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}

  .shelf-bar{
    position:relative;height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px;
  }
  .shelf-bar .fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .shelf-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:4px;font-family:'IBM Plex Mono';}

  .batch-list{display:flex;flex-direction:column;gap:10px;}
  .batch-row{
    display:grid;
    grid-template-columns: 1.6fr 1fr 0.9fr 1.3fr 0.8fr;
    gap:14px;align-items:center;
    padding:13px 14px;border:1px solid var(--line);border-radius:11px;
    background:#F7F9FD;
  }
  @media (max-width:900px){.batch-row{grid-template-columns:1fr; gap:8px;}}
  .batch-row .name{font-weight:600;font-size:14px;}
  .batch-row .sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .lot-chip{
    display:inline-block;font-family:'IBM Plex Mono';font-size:11px;
    background:var(--ice-soft);color:var(--teal-deep);padding:3px 8px;border-radius:6px;
    letter-spacing:.02em;
  }
  .qty-badge{font-family:'IBM Plex Mono';font-size:16px;font-weight:600;}
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
    padding:5px 10px;border-radius:20px;justify-self:start;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;}
  .status-pill.ok{background:var(--ok-soft);color:var(--ok);}
  .status-pill.ok .dot{background:var(--ok);}
  .status-pill.amber{background:var(--amber-soft);color:#96650E;}
  .status-pill.amber .dot{background:var(--amber);}
  .status-pill.danger{background:var(--danger-soft);color:var(--danger);}
  .status-pill.danger .dot{background:var(--danger);}
  .status-pill.low{background:#EFE7F8;color:#6B3FA0;}
  .status-pill.low .dot{background:#8355C4;}

  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{
    all:unset;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);border:1px solid var(--line);
  }
  .icon-btn:hover{background:var(--ice-soft);color:var(--teal-deep);}
  .icon-btn svg{width:14px;height:14px;}

  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select{
    padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus{outline:2px solid var(--ice); outline-offset:0; border-color:var(--ice);}
  .field.span2{grid-column:span 2;}
  @media (max-width:700px){.field.span2{grid-column:span 1;}}
  .field-error{color:var(--danger);font-size:11.5px;min-height:14px;display:block;}
  .form-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;align-items:center;}

  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
  }
  .empty svg{width:40px;height:40px;color:var(--ice);margin-bottom:10px;}
  .empty p{margin:4px 0;font-size:13.5px;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .chip-filter{
    all:unset;font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;
    border:1px solid var(--line);color:var(--ink-soft);background:#fff;
  }
  .chip-filter.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  .search-input{
    flex:1;min-width:180px;padding:9px 13px;border-radius:20px;border:1px solid var(--line);
    font-size:13px;font-family:inherit;
  }

  .hist-row{
    display:grid;grid-template-columns: 90px 1.4fr 0.8fr 0.7fr 1.1fr 1.1fr 1.2fr;
    gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;
  }
  @media (max-width:800px){.hist-row{grid-template-columns:1fr 1fr; row-gap:4px;}}
  .dest-summary{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px;margin-top:8px;}
  .dest-summary .n{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;}
  .dest-summary .tot{border-top:2px solid var(--line);padding-top:6px;font-weight:600;}
  .hist-row.head{font-weight:600;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);}
  .move-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
  .move-tag.entrada{background:var(--ok-soft);color:var(--ok);}
  .move-tag.saida{background:var(--ice-soft);color:var(--teal-deep);}
  .move-tag.descarte{background:var(--danger-soft);color:var(--danger);}
  .move-tag.remessa{background:#EFE7F8;color:#6B3FA0;}

  /* Guia de remessa — carrinho de itens */
  .cart-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .cart-row{
    display:grid;grid-template-columns:1.6fr 1fr 0.7fr 0.6fr auto;gap:10px;align-items:center;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#F7F9FD;font-size:13px;
  }
  @media (max-width:700px){.cart-row{grid-template-columns:1fr 1fr; row-gap:4px;}}
  .cart-total{
    display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 14px;
    background:var(--ice-soft);border-radius:10px;font-size:13px;font-weight:600;color:var(--teal-deep);
  }
  .guia-card{
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#F7F9FD;margin-bottom:10px;
  }
  .guia-card .num{font-family:'IBM Plex Mono';font-weight:600;color:var(--teal-deep);font-size:13.5px;}
  .guia-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .field textarea{
    padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-family:inherit;
    background:#fff;color:var(--ink);resize:vertical;min-height:60px;
  }

  /* Estoque diário */
  .grid-cards.six{grid-template-columns:repeat(6,1fr);}
  @media (max-width:1000px){.grid-cards.six{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:520px){.grid-cards.six{grid-template-columns:repeat(2,1fr);}}
  .grid-cards.six .stat-card .num{font-size:24px;}
  .date-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .date-bar input[type=date]{padding:8px 11px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);}
  .date-bar .date-label{font-size:13px;color:var(--ink-soft);margin-left:6px;}
  .table-scroll{overflow-x:auto;}
  .mapa-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;}
  table.mapa{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%;}
  table.mapa th,table.mapa td{padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;background:var(--panel);}
  table.mapa thead th{background:var(--ice-soft);color:var(--teal-deep);font-family:'IBM Plex Sans',sans-serif;font-weight:600;position:sticky;top:0;z-index:2;}
  table.mapa thead tr.sub th{top:33px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  table.mapa th.daygrp{text-align:center;border-left:2px solid var(--teal);}
  table.mapa td.first,table.mapa th.first{position:sticky;left:0;z-index:3;text-align:left;font-family:'IBM Plex Sans',sans-serif;font-weight:600;min-width:190px;border-right:2px solid var(--line);}
  table.mapa td.dstart{border-left:2px solid var(--teal);}
  table.mapa td.saldo{font-weight:700;background:#EEF2FA;}
  table.mapa td.pos{color:var(--ok);} table.mapa td.neg{color:var(--danger);}
  table.mapa tr.tot td{background:var(--ice-soft);font-weight:700;}
  table.mapa td.first,table.mapa th.first{width:190px;min-width:190px;max-width:190px;box-sizing:border-box;white-space:normal;}
  table.mapa td.second,table.mapa th.second{position:sticky;left:190px;z-index:3;text-align:left;min-width:96px;font-family:'IBM Plex Mono',monospace;font-weight:600;border-right:2px solid var(--line);}
  table.mapa th.second{font-family:'IBM Plex Sans',sans-serif;}
  table.mapa.lista td.pos{color:var(--ok);}
  .daily-table{min-width:640px;}
  .daily-row{
    display:grid;grid-template-columns:1.8fr repeat(6,0.8fr);gap:10px;align-items:center;
    padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px;
  }
  .daily-row.head{font-weight:600;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);}
  .daily-row.total{font-weight:700;background:var(--ice-soft);border-radius:8px;border-bottom:none;margin-top:6px;}
  .daily-row .num-cell{font-family:'IBM Plex Mono';text-align:right;}
  .daily-row.clickable{cursor:pointer;}
  .daily-row.clickable:hover{background:#EEF2FA;}
  .daily-row.selected{background:var(--ice-soft);border-radius:8px;}
  .daily-row.hist{grid-template-columns:0.9fr repeat(4,0.7fr) 1.6fr;}
  .bar-track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--ice);border-radius:5px;}
  .neg{color:var(--danger);}
  .pos{color:var(--ok);}

  /* Relatórios */
  .daily-row.lot{grid-template-columns:1.5fr 1fr 1.2fr 0.9fr repeat(6,0.65fr);}
  .daily-row.lotd{grid-template-columns:1.5fr 1fr 1.1fr 1.2fr repeat(4,0.7fr);}
  .daily-row .sub-line{display:block;font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;font-weight:400;}
  .daily-row.day{grid-template-columns:0.9fr repeat(5,0.8fr);}
  .daily-row.mov{grid-template-columns:1.2fr 1.4fr 1fr 0.8fr 0.6fr 1.8fr;}
  .daily-table.wide{min-width:880px;}
  .rep-controls .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .rep-controls .checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;}
  .rep-controls .checks label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink);}
  .rep-head{border-bottom:2px solid var(--teal);padding-bottom:12px;margin-bottom:18px;}
  .rep-head h2{font-size:19px;margin:0 0 6px;color:var(--teal-deep);display:block;}
  .rep-head .meta{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .rep-section{margin-top:22px;}
  .rep-section h3{margin:0 0 10px;}
  .rep-note{font-size:12px;color:var(--ink-soft);margin:6px 0 0;}
  @media print{
    @page{margin:12mm;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff;}
    .sidebar,.no-print,.toast,.modal-backdrop{display:none !important;}
    .app{display:block;}
    .main{padding:0;max-width:none;}
    .panel{box-shadow:none;border:none;padding:0;margin:0;}
    .table-scroll{overflow:visible;}
    .daily-table,.daily-table.wide{min-width:0;}
    .daily-row{font-size:10.5px;gap:6px;padding:6px 3px;page-break-inside:avoid;}
    .grid-cards.six{grid-template-columns:repeat(6,1fr);gap:8px;}
    .stat-card{box-shadow:none;padding:10px;}
    .grid-cards.six .stat-card .num{font-size:18px;}
    .rep-section{page-break-inside:auto;}
  }

  /* Pedidos das unidades de saúde */
  .pedido-card{
    padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#F7F9FD;margin-bottom:10px;
  }
  .pedido-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .pedido-card .num{font-family:'IBM Plex Mono';font-weight:600;color:var(--teal-deep);font-size:13.5px;}
  .pedido-card .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .pedido-card .itens-summary{font-size:12.5px;color:var(--ink);margin-top:8px;}
  .pedido-card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .ped-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  .ped-table th,.ped-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;}
  .ped-table th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);background:var(--ice-soft);}
  .ped-table .n,.ped-table td.n{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .ped-table th.n{font-family:inherit;}
  .confirm-item-block{
    border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#F7F9FD;
  }
  .confirm-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .confirm-item-header strong{font-size:14px;}
  .confirm-item-header .sub{font-size:11.5px;color:var(--ink-soft);}
  .confirm-progress{font-size:11.5px;font-weight:600;margin-top:8px;}
  .confirm-progress.ok{color:var(--ok);}
  .confirm-progress.warn{color:#96650E;}
  .mini-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;margin-top:6px;
  }

  .tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .tag-item{
    display:inline-flex;align-items:center;gap:7px;background:var(--ice-soft);color:var(--teal-deep);
    padding:6px 8px 6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;
  }
  .tag-item button{all:unset;display:flex;color:var(--teal-deep);opacity:.6;padding:2px;border-radius:50%;cursor:pointer;}
  .tag-item button:hover{opacity:1;background:rgba(6,27,74,0.12);}
  .tag-item button svg{width:11px;height:11px;}
  .add-tag-row{display:flex;gap:8px;margin-top:12px;}
  .add-tag-row input{flex:1;padding:8px 11px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-family:inherit;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--teal-deep);color:#fff;padding:11px 20px;border-radius:10px;
    font-size:13px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  #saveErrorToast{background:var(--danger);bottom:70px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(4,14,40,0.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal{
    background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  }
  .modal h3{margin:0 0 6px;font-size:16px;color:var(--teal-deep);}
  .modal p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);}

  .loading-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);font-size:13.5px;gap:10px;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--ice-soft);border-top-color:var(--teal);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>
(function () {
  "use strict";

  var DATA_KEY = "imunostock:data";

  var ICONS = {

    x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',

  };
  function icon(name, size) {
    size = size || 16;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:' + size + 'px;height:' + size + 'px;flex-shrink:0">' + (ICONS[name] || "") + '</svg>';
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function localDateOf(iso) { var d = new Date(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function addDays(dateStr, n) { var p = dateStr.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function daysUntil(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    var now = new Date(todayISO() + "T00:00:00");
    return Math.round((d - now) / 86400000);
  }
  function fmtDate(dateStr) {
    if (!dateStr) return "—";
    var p = dateStr.split("-");
    return p[2] + "/" + p[1] + "/" + p[0];
  }
  function tipoLabel(tipo) {
    return tipo === "entrada" ? "Entrada" : tipo === "saida" ? "Saída" : tipo === "remessa" ? "Remessa" : "Descarte";
  }
  // Soma de frascos que saíram (saída + remessa) por unidade/estabelecimento de destino
  function saidasPorDestino(movs) {
    var map = {}, total = 0;
    movs.forEach(function (m) {
      if (m.tipo !== "saida" && m.tipo !== "remessa") return;
      var d = (m.destino || "").trim() || "Destino não informado";
      map[d] = (map[d] || 0) + m.quantidade; total += m.quantidade;
    });
    var rows = Object.keys(map).map(function (k) { return { destino: k, frascos: map[k] }; })
      .sort(function (a, b) { return b.frascos - a.frascos; });
    return { rows: rows, total: total };
  }
  function unidadesConhecidas() {
    var set = {};
    function add(v) { v = (v || "").trim(); if (v) set[v] = true; }
    state.movements.forEach(function (m) { add(m.origem); add(m.destino); });
    state.remessas.forEach(function (r) { add(r.origem); add(r.destino); });
    state.pedidos.forEach(function (p) { add(p.unidade); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
  }
  function batchStatus(b) {
    var dleft = daysUntil(b.validade);
    if (b.quantidade <= 0) return { key: "vazio", label: "Esgotado", cls: "danger" };
    if (dleft < 0) return { key: "vencido", label: "Vencido", cls: "danger" };
    if (dleft <= 30) return { key: "vencendo", label: "Vence em " + dleft + "d", cls: "amber" };
    if (b.quantidade <= b.estoqueMinimo) return { key: "baixo", label: "Estoque baixo", cls: "low" };
    return { key: "ok", label: "Regular", cls: "ok" };
  }
  function shelfFill(b) {
    var total = Math.max(1, b.diasValidadeTotal || 365);
    var dleft = daysUntil(b.validade);
    var pct = Math.max(0, Math.min(100, (dleft / total) * 100));
    var color = "var(--ok)";
    if (dleft < 0) color = "var(--danger)";
    else if (dleft <= 30) color = "var(--amber)";
    else if (pct < 55) color = "var(--ice)";
    return { pct: pct, color: color, dleft: dleft };
  }

  var DEFAULT_FABRICANTES = ["Butantan", "Fiocruz/Bio-Manguinhos", "Pfizer", "Moderna", "AstraZeneca", "Sanofi", "GSK", "MSD", "Serum Institute"];
  var DEFAULT_VACINAS = ["BCG", "Hepatite B", "Pentavalente (DTP-HB-Hib)", "VIP/VOP (Poliomielite)", "Pneumocócica 10", "Rotavírus", "Meningocócica C", "Febre Amarela", "Tríplice Viral (SCR)", "Tetra Viral", "DTP (reforço)", "HPV", "Influenza", "COVID-19", "Varicela", "Hepatite A", "Dengue"];

  function exportExcel(batches, movements) {
    var wsBatches = XLSX.utils.json_to_sheet(batches.map(function (b) {
      var s = batchStatus(b);
      return {
        "Vacina": b.nome, "Fabricante": b.fabricante, "Apresentação": b.apresentacao || "", "Lote": b.lote, "Nota fiscal": b.notaFiscal || "",
        "Frascos atuais": b.quantidade, "Frascos iniciais": b.quantidadeInicial,
        "Estoque mínimo": b.estoqueMinimo, "Validade": fmtDate(b.validade),
        "Data de entrada": fmtDate(b.dataEntrada), "Temperatura": b.temperatura,
        "Status": s.label
      };
    }));
    var wsMoves = XLSX.utils.json_to_sheet(movements.map(function (m) {
      return {
        "Data": new Date(m.data).toLocaleString("pt-BR"), "Vacina": m.vacinaNome, "Lote": m.lote,
        "Tipo": tipoLabel(m.tipo),
        "Frascos": m.quantidade, "Origem": m.origem || "", "Destino": m.destino || "", "Observação": m.motivo || ""
      };
    }));
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsBatches, "Estoque");
    XLSX.utils.book_append_sheet(wb, wsMoves, "Movimentações");
    var wsDest = XLSX.utils.json_to_sheet(saidasPorDestino(movements).rows.map(function (r) { return { "Destino": r.destino, "Frascos enviados/saídos": r.frascos }; }));
    XLSX.utils.book_append_sheet(wb, wsDest, "Saídas por destino");
    XLSX.writeFile(wb, "imunostock_relatorio_" + todayISO() + ".xlsx");
  }

  function exportPDF(batches, movements) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF();
    doc.setFontSize(16);
    doc.text("ImunoStock — Relatório de Estoque de Vacinas", 14, 16);
    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text("Gerado em " + new Date().toLocaleString("pt-BR"), 14, 22);

    var rows = batches.slice().sort(function (a, b) { return daysUntil(a.validade) - daysUntil(b.validade); })
      .map(function (b) {
        var s = batchStatus(b);
        return [b.nome, b.fabricante, b.lote, String(b.quantidade), fmtDate(b.validade), s.label];
      });
    doc.autoTable({
      startY: 28,
      head: [["Vacina", "Fabricante", "Lote", "Frascos", "Validade", "Status"]],
      body: rows,
      styles: { fontSize: 8.5, cellPadding: 3 },
      headStyles: { fillColor: [10, 42, 107] },
      theme: "striped"
    });

    var totalDoses = batches.reduce(function (s, b) { return s + b.quantidade; }, 0);
    var critico = batches.filter(function (b) { var s = batchStatus(b); return s.key === "vencido" || s.key === "vencendo"; }).length;
    var y = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(10);
    doc.setTextColor(20);
    doc.text("Total de frascos em estoque: " + totalDoses, 14, y);
    doc.text("Lotes cadastrados: " + batches.length, 14, y + 6);
    doc.text("Lotes em alerta de validade: " + critico, 14, y + 12);

    var recentMoves = movements.slice(0, 25).map(function (m) {
      return [
        new Date(m.data).toLocaleDateString("pt-BR"), m.vacinaNome, m.lote,
        tipoLabel(m.tipo),
        String(m.quantidade),
        m.origem || "—",
        m.destino || "—"
      ];
    });
    if (recentMoves.length) {
      doc.addPage();
      doc.setFontSize(13);
      doc.setTextColor(20);
      doc.text("Movimentações recentes", 14, 16);
      doc.autoTable({
        startY: 22,
        head: [["Data", "Vacina", "Lote", "Tipo", "Frascos", "Origem", "Destino"]],
        body: recentMoves,
        styles: { fontSize: 8.5, cellPadding: 3 },
        headStyles: { fillColor: [10, 42, 107] },
        theme: "striped"
      });
    }
    doc.save("imunostock_relatorio_" + todayISO() + ".pdf");
  }

  // ---------------- state ----------------
  var state = {
    ready: false,
    batches: [],
    movements: [],
    remessas: [],
    pedidos: [],
    settings: { vacinas: DEFAULT_VACINAS.slice(), fabricantes: DEFAULT_FABRICANTES.slice() },
    page: "dashboard",
    confirmDeleteId: null,
    filterEstoque: "todos",
    searchEstoque: "",
    filterHistorico: "todos",
    filterPedidos: "todos",

  };
  var entradaErrors = {};
  var saidaError = "";
  var toastTimer = null;

  var pedidoCart = []; // itens sendo montados em um novo pedido

  var confirmCart = {}; // { itemIdx: [ { batchId, nome, fabricante, lote, validade, quantidade } ] }

  var root = document.getElementById("root");

  var toastEl = document.getElementById("toast");

  function showToast(msg) {

  }
  var SAVE_ERR_DEFAULT = "Falha ao salvar neste navegador (armazenamento cheio ou bloqueado). Exporte um backup.";

    saveErrorEl.classList.toggle("show", !!on);
  }

  // ---------------- armazenamento local (localStorage do navegador) ----------------
  var LAST_BACKUP_KEY = "imunostock:lastBackup";
  var memStore = {};
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return memStore[k] || null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { memStore[k] = v; return false; }
  }

  function normSettings(p) {
    return {
      vacinas: (p && p.vacinas && p.vacinas.length) ? p.vacinas : DEFAULT_VACINAS.slice(),

    };
  }
  function postLoadFixes() {
    state.movements.forEach(function (m) {

      // registros antigos de remessa: recupera origem/destino a partir da guia
      if (m.tipo === "remessa" && !m.destino) {
        var mm = /^Remessa (GR-\d+)/.exec(m.motivo || "");
        var g = mm && state.remessas.find(function (r) { return r.numero === mm[1]; });
        if (g) { m.origem = m.origem || g.origem; m.destino = g.destino; }
        else { var d2 = /destino: (.*)$/.exec(m.motivo || ""); if (d2) m.destino = d2[1]; }
      }
    });
  }


  // ---------------- arquivo de dados (Excel / CSV) ----------------
  var FSA = !!(window.showSaveFilePicker && window.showOpenFilePicker);
  var SAVED_AT_KEY = "imunostock:savedAt";
  var XLSX_TYPES = [{ description: "Planilha Excel (.xlsx)", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }];
  var fileState = { handle: null, name: "", status: "none", savedAt: null, msg: "" };
  var fileTimer = null, fileDirty = false, fileQueue = Promise.resolve();

  // Estrutura de cada aba: [cabeçalho, campo, tipo]  (tipo: n = número, d = data, t = data/hora, vazio = texto)
  var XL = {
    Lotes: { key: "batches", cols: [["ID", "id"], ["Vacina", "nome"], ["Fabricante", "fabricante"], ["Apresentação", "apresentacao"], ["Lote", "lote"], ["Nota fiscal", "notaFiscal"], ["Validade", "validade", "d"], ["Data de entrada", "dataEntrada", "d"], ["Temperatura", "temperatura"], ["Estoque mínimo", "estoqueMinimo", "n"], ["Frascos atuais", "quantidade", "n"], ["Frascos iniciais", "quantidadeInicial", "n"], ["Dias de validade total", "diasValidadeTotal", "n"]] },
    Movimentacoes: { key: "movements", cols: [["ID", "id"], ["ID do lote", "batchId"], ["Data/hora", "data", "t"], ["Tipo", "tipo"], ["Vacina", "vacinaNome"], ["Lote", "lote"], ["Frascos", "quantidade", "n"], ["Origem", "origem"], ["Destino", "destino"], ["Nota fiscal", "notaFiscal"], ["Observação", "motivo"]] },
    Remessas: { key: "remessas", cols: [["ID", "id"], ["Número", "numero"], ["Data de envio", "data", "d"], ["Criada em", "criadoEm", "t"], ["Origem", "origem"], ["Responsável (origem)", "responsavelOrigem"], ["Destino", "destino"], ["Responsável (destino)", "responsavelDestino"], ["Endereço do destino", "enderecoDestino"], ["Transporte", "transporte"], ["Temperatura", "temperatura"], ["Caixa térmica", "caixaTermica"], ["Observações", "observacoes"], ["Pedido", "pedidoNumero"]] },
    Pedidos: { key: "pedidos", cols: [["ID", "id"], ["Número", "numero"], ["Data", "data", "d"], ["Criado em", "criadoEm", "t"], ["Unidade", "unidade"], ["Responsável", "responsavel"], ["Contato", "contato"], ["Observações", "observacoes"], ["Status", "status"], ["Conf. data", "_cData", "d"], ["Conf. ID da remessa", "_cRemId"], ["Conf. nº da guia", "_cRemNum"], ["Conf. responsável", "_cResp"]] }
  };
  var XL_ITENS_ENVIO = [["ID do lote", "batchId"], ["Vacina", "nome"], ["Fabricante", "fabricante"], ["Lote", "lote"], ["Validade", "validade", "d"], ["Frascos", "quantidade", "n"]];
  var XL_ITENS_PEDIDO = [["Vacina", "nome"], ["Frascos", "quantidade", "n"]];

  function xlPad(n, w) { return String(n).padStart(w || 2, "0"); }
  function xlConv(v, type) {
    if (v === undefined || v === null) v = "";
    if (type === "n") { if (v === "") return 0; var n = Number(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; }
    if (type === "d" || type === "t") {
      if (typeof v === "number") {
        var c = XLSX.SSF.parse_date_code(v);
        if (c) {
          if (type === "d") return xlPad(c.y, 4) + "-" + xlPad(c.m) + "-" + xlPad(c.d);
          return new Date(c.y, c.m - 1, c.d, c.H || 0, c.M || 0, Math.floor(c.S || 0)).toISOString();
        }
      }
      var str = String(v).trim();
      var br = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str);
      if (br) return br[3] + "-" + br[2] + "-" + br[1];
      return str;
    }
    return String(v);
  }
  function xlCell(v) { return (v === undefined || v === null) ? "" : v; }

  function buildWorkbook() {
    var wb = XLSX.utils.book_new();
    function add(name, headers, rows) {
      var ws = XLSX.utils.aoa_to_sheet([headers].concat(rows));
      ws["!cols"] = headers.map(function (h) { return { wch: Math.min(40, Math.max(12, String(h).length + 2)) }; });
      XLSX.utils.book_append_sheet(wb, ws, name);
    }
    function heads(cols) { return cols.map(function (c) { return c[0]; }); }
    function rowsOf(list, cols) { return list.map(function (o) { return cols.map(function (c) { return xlCell(o[c[1]]); }); }); }
    add("Lotes", heads(XL.Lotes.cols), rowsOf(state.batches, XL.Lotes.cols));
    add("Movimentacoes", heads(XL.Movimentacoes.cols), rowsOf(state.movements, XL.Movimentacoes.cols));
    add("Remessas", heads(XL.Remessas.cols), rowsOf(state.remessas, XL.Remessas.cols));
    var ri = [];
    state.remessas.forEach(function (r) { (r.itens || []).forEach(function (it) { ri.push([r.id].concat(XL_ITENS_ENVIO.map(function (c) { return xlCell(it[c[1]]); }))); }); });
    add("Remessa_itens", ["ID da remessa"].concat(heads(XL_ITENS_ENVIO)), ri);
    var pedRows = state.pedidos.map(function (p) {
      var cf = p.confirmacao || {};
      var o = Object.assign({}, p, { _cData: cf.data, _cRemId: cf.remessaId, _cRemNum: cf.remessaNumero, _cResp: cf.responsavelEnvio });
      return XL.Pedidos.cols.map(function (c) { return xlCell(o[c[1]]); });
    });
    add("Pedidos", heads(XL.Pedidos.cols), pedRows);
    var pi = [], pe = [];
    state.pedidos.forEach(function (p) {
      (p.itens || []).forEach(function (it) { pi.push([p.id].concat(XL_ITENS_PEDIDO.map(function (c) { return xlCell(it[c[1]]); }))); });
      ((p.confirmacao && p.confirmacao.itensEnviados) || []).forEach(function (it) { pe.push([p.id].concat(XL_ITENS_ENVIO.map(function (c) { return xlCell(it[c[1]]); }))); });
    });
    add("Pedido_itens", ["ID do pedido"].concat(heads(XL_ITENS_PEDIDO)), pi);
    add("Pedido_enviados", ["ID do pedido"].concat(heads(XL_ITENS_ENVIO)), pe);
    var cfg = [];
    state.settings.vacinas.forEach(function (v) { cfg.push(["Vacina", v]); });
    state.settings.fabricantes.forEach(function (f) { cfg.push(["Fabricante", f]); });
    add("Configuracoes", ["Tipo", "Valor"], cfg);
    var info = XLSX.utils.aoa_to_sheet([
      ["ImunoStock — arquivo de dados"],
      ["Gravado em", new Date().toLocaleString("pt-BR")],
      ["Aviso", "Não renomeie as abas nem os cabeçalhos. A coluna ID identifica cada registro; para novas linhas, deixe o ID em branco."],
      ["Aviso", "Feche o arquivo no Excel para que o aplicativo consiga gravar nele."]
    ]);
    info["!cols"] = [{ wch: 14 }, { wch: 100 }];
    XLSX.utils.book_append_sheet(wb, info, "Leia-me");
    return wb;
  }

  function xlRead(ws, cols) {
    if (!ws) return [];
    var rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
    var out = [];
    rows.forEach(function (r) {
      var o = {}, any = false;
      cols.forEach(function (c) {
        var v = r[c[0]];
        if (v !== undefined && v !== "") any = true;
        o[c[1]] = xlConv(v, c[2]);
      });
      if (any) out.push(o);
    });
    return out;
  }

  function parseWorkbook(wb) {
    if (!wb || !wb.Sheets || (!wb.Sheets.Lotes && !wb.Sheets.Movimentacoes)) throw new Error("o arquivo não parece ser uma planilha do ImunoStock");
    var d = {};
    Object.keys(XL).forEach(function (name) { d[XL[name].key] = xlRead(wb.Sheets[name], XL[name].cols); });
    function group(sheet, firstHeader, cols) {
      var map = {};
      var rows = wb.Sheets[sheet] ? XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: "", raw: true }) : [];
      rows.forEach(function (r) {
        var pid = String(r[firstHeader] == null ? "" : r[firstHeader]);
        if (!pid) return;
        var o = {}; cols.forEach(function (c) { o[c[1]] = xlConv(r[c[0]], c[2]); });
        (map[pid] = map[pid] || []).push(o);
      });
      return map;
    }
    var remItens = group("Remessa_itens", "ID da remessa", XL_ITENS_ENVIO);
    var pedItens = group("Pedido_itens", "ID do pedido", XL_ITENS_PEDIDO);
    var pedEnv = group("Pedido_enviados", "ID do pedido", XL_ITENS_ENVIO);
    ["batches", "movements", "remessas", "pedidos"].forEach(function (k) { d[k].forEach(function (o) { if (!o.id) o.id = uid(); }); });
    d.batches.forEach(function (b) {
      if (!b.quantidadeInicial && b.quantidade) b.quantidadeInicial = b.quantidade;
      if (!b.diasValidadeTotal) b.diasValidadeTotal = Math.max(1, daysUntil(b.validade));
    });
    d.movements.forEach(function (m) { m.tipo = String(m.tipo || "").toLowerCase(); });
    d.remessas.forEach(function (r) { r.itens = remItens[r.id] || []; r.pedidoNumero = r.pedidoNumero || null; });
    d.pedidos.forEach(function (p) {
      p.itens = pedItens[p.id] || [];
      if (p.status === "confirmado" || p._cRemId) {
        p.confirmacao = { data: p._cData, remessaId: p._cRemId, remessaNumero: p._cRemNum, itensEnviados: pedEnv[p.id] || [], responsavelEnvio: p._cResp };
      } else p.confirmacao = null;
      delete p._cData; delete p._cRemId; delete p._cRemNum; delete p._cResp;
    });
    var cfgRows = wb.Sheets.Configuracoes ? XLSX.utils.sheet_to_json(wb.Sheets.Configuracoes, { defval: "", raw: true }) : [];
    var vac = [], fab = [];
    cfgRows.forEach(function (r) {
      var t = String(r["Tipo"] || "").toLowerCase(), v = String(r["Valor"] == null ? "" : r["Valor"]).trim();
      if (!v) return;
      if (t === "vacina") vac.push(v); else if (t === "fabricante") fab.push(v);
    });
    d.settings = { vacinas: vac, fabricantes: fab };
    return d;
  }

  function applyData(d) {
    state.batches = d.batches || []; state.movements = d.movements || [];
    state.remessas = d.remessas || []; state.pedidos = d.pedidos || [];
    if (d.settings) state.settings = normSettings(d.settings);
    postLoadFixes();
    lsSet(DATA_KEY, JSON.stringify({ batches: state.batches, movements: state.movements, remessas: state.remessas, pedidos: state.pedidos }));
    lsSet(SETTINGS_KEY, JSON.stringify(state.settings));
    lsSet(SAVED_AT_KEY, new Date().toISOString());
  }
  function hasAnyData() { return state.batches.length || state.movements.length || state.remessas.length || state.pedidos.length; }

  async function readFileHandle(h) {
    var f = await h.getFile();
    if (!f.size) return { data: null, modified: f.lastModified };
    var buf = await f.arrayBuffer();
    return { data: parseWorkbook(XLSX.read(buf, { type: "array" })), modified: f.lastModified };
  }

  // ---- gravação automática no arquivo vinculado ----
  function scheduleFileWrite() {
    if (!fileState.handle || fileState.status === "pending") return;
    fileDirty = true;
    clearTimeout(fileTimer);
    fileTimer = setTimeout(function () { fileQueue = fileQueue.catch(function () {}).then(writeFileNow); }, 300);
  }
  async function writeFileNow() {
    if (!fileState.handle) return;
    try {
      var wb = buildWorkbook();
      var buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
      var w = await fileState.handle.createWritable();
      await w.write(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      await w.close();
      fileState.status = "ok"; fileState.savedAt = new Date(); fileState.msg = "";
      fileDirty = false;
      showSaveError(false);
    } catch (e) {
      fileState.status = "error";
      fileState.msg = (e && e.name === "NoModificationAllowedError") ? "feche o arquivo no Excel para permitir a gravação" : ((e && e.message) || String(e));
      showSaveError(true, "Não foi possível gravar em " + fileState.name + ": " + fileState.msg);
    }
    updateFileBadge();
  }
  window.addEventListener("beforeunload", function (e) { if (fileDirty) { e.preventDefault(); e.returnValue = ""; } });

  // ---- IndexedDB: guarda o vínculo com o arquivo entre sessões ----
  function idbOpen() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("imunostock-arquivo", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("h"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  async function idbGet(k) { var db = await idbOpen(); return new Promise(function (res, rej) { var q = db.transaction("h").objectStore("h").get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }
  async function idbSet(k, v) { var db = await idbOpen(); return new Promise(function (res, rej) { var q = db.transaction("h", "readwrite").objectStore("h").put(v, k); q.onsuccess = function () { res(); }; q.onerror = function () { rej(q.error); }; }); }
  async function idbDel(k) { var db = await idbOpen(); return new Promise(function (res, rej) { var q = db.transaction("h", "readwrite").objectStore("h").delete(k); q.onsuccess = function () { res(); }; q.onerror = function () { rej(q.error); }; }); }

  async function fileLink(h) {
    fileState.handle = h; fileState.name = h.name; fileState.status = "ok"; fileState.msg = "";
    try { await idbSet("handle", h); } catch (e) { /* vínculo só nesta sessão */ }
  }
  // Decide entre arquivo e dados do navegador (qual é mais recente) e aplica
  async function fileSyncFromHandle(h, interactive) {
    var r = await readFileHandle(h);
    var cacheAt = Date.parse(lsGet(SAVED_AT_KEY) || "") || 0;
    if (!r.data) { await fileLink(h); await writeFileNow(); return "gravado"; }
    var cacheNewer = hasAnyData() && cacheAt && cacheAt > r.modified + 3000;
    if (cacheNewer) {
      var keepBrowser = confirm("Os dados deste navegador são mais recentes que o arquivo " + h.name + ".\n\nOK = gravar os dados do navegador no arquivo\nCancelar = carregar os dados do arquivo");
      await fileLink(h);
      if (keepBrowser) { await writeFileNow(); return "gravado"; }
    }
    applyData(r.data);
    await fileLink(h);
    return "carregado";
  }

  async function fileRestoreOnStart() {
    if (!FSA) return;
    try {
      var h = await idbGet("handle");
      if (!h) return;
      fileState.handle = h; fileState.name = h.name;
      var perm = await h.queryPermission({ mode: "readwrite" });
      if (perm === "granted") { await fileSyncFromHandle(h, false); }
      else fileState.status = "pending";
    } catch (e) { fileState.status = "error"; fileState.msg = (e && e.message) || String(e); }
  }
  async function fileReconnect() {
    try {
      var h = fileState.handle;
      if (!h) return;
      var perm = await h.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") { showToast("Permissão negada para o arquivo"); return; }
      var how = await fileSyncFromHandle(h, true);
      renderApp();
      showToast("Arquivo " + h.name + " " + how);
    } catch (e) { alert("Não foi possível reconectar: " + ((e && e.message) || e)); }
  }
  async function fileCreateNew() {
    if (!FSA) { alert("Este navegador não permite gravar direto em arquivo. Use o Chrome ou o Edge, ou o botão \"Baixar Excel agora\"."); return; }
    try {
      var h = await window.showSaveFilePicker({ suggestedName: "imunostock_dados.xlsx", types: XLSX_TYPES });
      await fileLink(h);
      await writeFileNow();
      renderMain();
      if (fileState.status === "ok") showToast("Arquivo vinculado: " + h.name);
    } catch (e) { if (!e || e.name !== "AbortError") alert("Não foi possível criar o arquivo: " + ((e && e.message) || e)); }
  }
  async function fileOpenExisting() {
    if (!FSA) { alert("Este navegador não permite gravar direto em arquivo. Use o Chrome ou o Edge, ou o botão \"Importar Excel\"."); return; }
    try {
      var hs = await window.showOpenFilePicker({ types: XLSX_TYPES, multiple: false });
      var h = hs[0];
      var r = await readFileHandle(h);
      if (r.data) {
        if (hasAnyData() && !confirm("Substituir os dados atuais pelos dados do arquivo " + h.name + "?")) return;
        applyData(r.data);
        await fileLink(h);
        renderApp();
        showToast("Dados carregados de " + h.name);
      } else {
        await fileLink(h);
        await writeFileNow();
        renderMain();
        showToast("Arquivo vazio: dados atuais gravados em " + h.name);
      }
    } catch (e) { if (!e || e.name !== "AbortError") alert("Não foi possível abrir o arquivo: " + ((e && e.message) || e)); }
  }
  async function fileReloadFromFile() {
    if (!fileState.handle) return;
    try {
      var r = await readFileHandle(fileState.handle);
      if (!r.data) { alert("O arquivo está vazio."); return; }
      if (!confirm("Recarregar os dados do arquivo " + fileState.name + "? As alterações não gravadas serão perdidas.")) return;
      applyData(r.data);
      renderApp();
      showToast("Dados recarregados do arquivo");
    } catch (e) { alert("Não foi possível ler o arquivo: " + ((e && e.message) || e)); }
  }
  async function fileUnlink() {
    if (!confirm("Desvincular o arquivo? Os dados continuam salvos neste navegador.")) return;
    fileState.handle = null; fileState.name = ""; fileState.status = "none"; fileState.msg = "";
    try { await idbDel("handle"); } catch (e) { /* ignora */ }
    renderMain();
  }

  function downloadBlob(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }
  function xlDownload() {
    XLSX.writeFile(buildWorkbook(), "imunostock_dados_" + todayISO() + ".xlsx");
    lsSet(LAST_BACKUP_KEY, new Date().toISOString());
    renderMain();
  }
  function csvExport() {
    var wb = buildWorkbook();
    var names = ["Lotes", "Movimentacoes", "Remessas", "Pedidos"];
    names.forEach(function (n, i) {
      setTimeout(function () {
        var csv = XLSX.utils.sheet_to_csv(wb.Sheets[n], { FS: ";" });
        downloadBlob(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }), "imunostock_" + n.toLowerCase() + "_" + todayISO() + ".csv");
      }, i * 400);
    });
    showToast("Gerando 4 arquivos CSV (o navegador pode pedir permissão para vários downloads)");
  }
  function xlImportFile(file) {
    var reader = new FileReader();
    reader.onload = async function () {
      try {
        var d = parseWorkbook(XLSX.read(reader.result, { type: "array" }));
        if (!confirm("Substituir os dados atuais pelos da planilha (" + d.batches.length + " lotes, " + d.movements.length + " movimentações)?")) return;
        applyData(d);
        scheduleFileWrite();
        renderApp();
        showToast("Planilha importada");
      } catch (e) { alert("Não foi possível importar: " + ((e && e.message) || e)); }
    };
    reader.readAsArrayBuffer(file);
  }

  function fileBadgeInner() {
    var t;
    if (!FSA) t = "Dados no navegador. Para gravar em Excel, use o Chrome ou o Edge (ou baixe a planilha em Configurações).";
    else if (fileState.status === "ok") t = "Gravando em " + fileState.name + (fileState.savedAt ? " · " + fileState.savedAt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "");
    else if (fileState.status === "pending") t = "Arquivo " + fileState.name + ": clique para reconectar";
    else if (fileState.status === "error") t = "Erro ao gravar " + fileState.name + ": " + fileState.msg;
    else t = "Sem arquivo Excel vinculado — dados só no navegador. Clique para vincular.";
    return icon("file", 13) + '<span>' + esc(t) + '</span>';
  }
  function updateFileBadge() {
    var el = document.getElementById("fileBadge");
    if (!el) return;
    el.innerHTML = fileBadgeInner();
    el.setAttribute("data-action", fileState.status === "pending" ? "file-reconnect" : "goto-config");
    el.style.background = fileState.status === "error" ? "rgba(214,69,65,0.35)" : "";
  }

  async function loadAll() {
    try {
      var raw = lsGet(DATA_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.batches = parsed.batches || [];
        state.movements = parsed.movements || [];
        state.remessas = parsed.remessas || [];
        state.pedidos = parsed.pedidos || [];
        postLoadFixes();
      }
    } catch (e) { /* sem dados ainda */ }
    try {
      var raw2 = lsGet(SETTINGS_KEY);
      if (raw2) state.settings = normSettings(JSON.parse(raw2));
    } catch (e) { /* usa padrão */ }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
    await fileRestoreOnStart();
    state.ready = true;
    renderApp();
  }

  function persistData() {
    var ok = lsSet(DATA_KEY, JSON.stringify({ batches: state.batches, movements: state.movements, remessas: state.remessas, pedidos: state.pedidos }));
    lsSet(SAVED_AT_KEY, new Date().toISOString());
    if (!ok) showSaveError(true);
    scheduleFileWrite();
    return Promise.resolve(ok);
  }
  function persistSettings() {
    var ok = lsSet(SETTINGS_KEY, JSON.stringify(state.settings));
    lsSet(SAVED_AT_KEY, new Date().toISOString());
    if (!ok) showSaveError(true);
    scheduleFileWrite();
    return Promise.resolve(ok);
  }

  // ---- backup / restauração ----
  function exportBackup() {
    var blob = new Blob([JSON.stringify({ versao: 1, geradoEm: new Date().toISOString(), batches: state.batches, movements: state.movements, remessas: state.remessas, pedidos: state.pedidos, settings: state.settings }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "imunostock_backup_" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    lsSet(LAST_BACKUP_KEY, new Date().toISOString());
    showToast("Backup exportado");
    renderMain();
  }
  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = async function () {
      try {
        var p = JSON.parse(reader.result);
        if (!p || !Array.isArray(p.batches)) throw new Error("arquivo inválido");
        if (!confirm("Substituir os dados atuais pelo backup (" + p.batches.length + " lotes, " + (p.movements || []).length + " movimentações)?")) return;
        state.batches = p.batches; state.movements = p.movements || []; state.remessas = p.remessas || []; state.pedidos = p.pedidos || [];
        if (p.settings) state.settings = normSettings(p.settings);
        postLoadFixes();
        await persistData();
        await persistSettings();
        renderMain();
        showToast("Backup importado");
      } catch (e) { alert("Não foi possível importar: " + e.message); }
    };
    reader.readAsText(file);
  }
  function clearAllData() {
    if (!confirm("Apagar TODOS os dados deste navegador (lotes, movimentações, remessas e pedidos)? Exporte um backup antes.")) return;
    if (!confirm("Tem certeza? Esta ação não pode ser desfeita.")) return;
    state.batches = []; state.movements = []; state.remessas = []; state.pedidos = [];
    state.settings = normSettings(null);
    persistData(); persistSettings();
    renderMain();
    showToast("Dados apagados");
  }

  function addBatch(b) {
    var diasValidadeTotal = Math.max(1, daysUntil(b.validade));
    var newBatch = Object.assign({}, b, { id: uid(), diasValidadeTotal: diasValidadeTotal, quantidadeInicial: b.quantidade });
    var mv = { id: uid(), batchId: newBatch.id, tipo: "entrada", quantidade: b.quantidade, data: new Date().toISOString(), motivo: "Cadastro inicial de lote" + (b.notaFiscal ? " — NF " + b.notaFiscal : ""), notaFiscal: b.notaFiscal || "", origem: "", destino: "", vacinaNome: b.nome, lote: b.lote };
    state.batches = [newBatch].concat(state.batches);
    state.movements = [mv].concat(state.movements);
    persistData();
    showToast("Lote " + b.lote + " cadastrado com sucesso");
    return newBatch;
  }

  function registerMovement(batchId, tipo, quantidade, motivo, origem, destino) {
    var batch = state.batches.find(function (b) { return b.id === batchId; });
    if (!batch) return;
    var novaQtd = batch.quantidade;
    if (tipo === "saida" || tipo === "descarte" || tipo === "remessa") novaQtd -= quantidade; else novaQtd += quantidade;
    novaQtd = Math.max(0, novaQtd);
    state.batches = state.batches.map(function (b) { return b.id === batchId ? Object.assign({}, b, { quantidade: novaQtd }) : b; });
    var mv = { id: uid(), batchId: batchId, tipo: tipo, quantidade: quantidade, data: new Date().toISOString(), motivo: motivo || (tipo === "saida" ? "Saída de frascos" : tipo === "descarte" ? "Descarte" : "Reposição"), origem: origem || "", destino: destino || "", vacinaNome: batch.nome, lote: batch.lote };
    state.movements = [mv].concat(state.movements);
    persistData();
    showToast(tipo === "saida" ? "Saída registrada" : tipo === "descarte" ? "Descarte registrado" : "Entrada registrada");
  }

  // ---------------- etiqueta de identificação (câmara) ----------------
  function generateEtiqueta(batch, copies) {
    copies = Math.max(1, Math.min(200, copies || 1));
    var jsPDF = window.jspdf.jsPDF;
    var W = 100, H = 60;
    var doc = new jsPDF({ orientation: "landscape", unit: "mm", format: [W, H] });
    function fit(text, maxW, startSize, minSize) {
      var size = startSize;
      doc.setFontSize(size);
      while (size > minSize && doc.getTextWidth(text) > maxW) { size -= 0.5; doc.setFontSize(size); }
      return size;
    }
    for (var i = 0; i < copies; i++) {
      if (i > 0) doc.addPage([W, H], "landscape");
      doc.setDrawColor(10, 42, 107); doc.setLineWidth(0.6);
      doc.rect(2, 2, W - 4, H - 4);
      doc.setFillColor(10, 42, 107);
      doc.rect(2, 2, W - 4, 8, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(255, 255, 255);
      doc.text("IDENTIFICAÇÃO DE IMUNOBIOLÓGICO", W / 2, 7.4, { align: "center" });

      // nome da vacina (quebra em até 2 linhas, reduz a fonte se necessário)
      doc.setTextColor(6, 27, 74);
      var nome = batch.nome || "—";
      var size = 17;
      doc.setFontSize(size);
      var lines = doc.splitTextToSize(nome, W - 12);
      while (lines.length > 2 && size > 9) { size -= 1; doc.setFontSize(size); lines = doc.splitTextToSize(nome, W - 12); }
      var ny = lines.length > 1 ? 17 : 19;
      lines.slice(0, 2).forEach(function (ln, k) { doc.text(ln, W / 2, ny + k * (size * 0.38), { align: "center" }); });

      // campos
      var fy = 29, lh = 6.2;
      function field(label, value, y, x, valX, maxW) {
        x = x || 7; valX = valX || 33; maxW = maxW || (W - 42);
        doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(74, 91, 127);
        doc.text(label, x, y);
        doc.setFont("helvetica", "normal"); doc.setTextColor(10, 22, 51);
        var v = String(value || "—");
        fit(v, maxW, 10, 6.5);
        doc.text(v, valX, y);
      }
      field("FABRICANTE", batch.fabricante, fy);
      field("APRESENTAÇÃO", batch.apresentacao || "Não informada", fy + lh);
      field("LOTE", batch.lote, fy + lh * 2, 7, 33, 24);

      doc.text("VALIDADE", 7, fy + lh * 2 + 9.2);

    }
    doc.save("etiqueta_" + String(batch.lote || "lote").replace(/[^A-Za-z0-9_-]/g, "") + ".pdf");
  }

  // ---------------- guia de remessa ----------------
  function registerRemessa(dados) {
    var numero = "GR-" + String(state.remessas.length + 1).padStart(4, "0");
    var remessa = {
      id: uid(),
      numero: numero,
      data: dados.dataEnvio,
      criadoEm: new Date().toISOString(),
      origem: dados.origem,
      responsavelOrigem: dados.responsavelOrigem,
      destino: dados.destino,
      responsavelDestino: dados.responsavelDestino,
      enderecoDestino: dados.enderecoDestino,
      transporte: dados.transporte,
      temperatura: dados.temperatura,
      caixaTermica: dados.caixaTermica,
      observacoes: dados.observacoes,
      pedidoNumero: dados.pedidoNumero || null,
      itens: dados.itens // [{ batchId, nome, fabricante, lote, validade, quantidade }]
    };

    // debita o estoque de cada lote e registra a movimentação de remessa
    dados.itens.forEach(function (item) {
      var batch = state.batches.find(function (b) { return b.id === item.batchId; });
      if (!batch) return;
      var novaQtd = Math.max(0, batch.quantidade - item.quantidade);
      state.batches = state.batches.map(function (b) { return b.id === item.batchId ? Object.assign({}, b, { quantidade: novaQtd }) : b; });
      var mv = { id: uid(), batchId: item.batchId, tipo: "remessa", quantidade: item.quantidade, data: new Date().toISOString(), motivo: "Remessa " + numero + " — destino: " + dados.destino, origem: dados.origem, destino: dados.destino, vacinaNome: item.nome, lote: item.lote };
      state.movements = [mv].concat(state.movements);
    });

    state.remessas = [remessa].concat(state.remessas);
    persistData();
    gerarPdf(generateGuiaPDF, remessa);
    showToast(lastPdfOk ? "Guia " + numero + " gerada e remessa registrada" : "Remessa " + numero + " registrada, mas o PDF não foi gerado — use 'Baixar PDF' depois");
    return remessa;
  }

    doc.text("Destinatário", 108, boxY);

    var transpY = boxY + 28;
    doc.setFontSize(10.5);
    doc.setTextColor(10, 42, 107);

    doc.setFontSize(9.5);
    doc.setTextColor(30);

  // ---------------- pedidos das unidades de saúde ----------------
  // ---------------- PDF: verificação e PDF do pedido ----------------
  var lastPdfOk = false;
  // O PDF depende de bibliotecas carregadas da internet (jsPDF e AutoTable). Se não carregaram, avisa claramente.
  function pdfPronto() {
    var ok = window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && typeof window.jspdf.jsPDF.API.autoTable === "function";
    if (!ok) alert("Não foi possível gerar o PDF: a biblioteca de PDF não foi carregada (ela vem da internet). Verifique a conexão e recarregue a página.");
    return !!ok;
  }
  function gerarPdf(fn, arg) {
    lastPdfOk = false;
    if (!pdfPronto()) return false;
    try { fn(arg); lastPdfOk = true; }
    catch (e) { console.error(e); alert("Erro ao gerar o PDF: " + ((e && e.message) || e)); }
    return lastPdfOk;
  }

  // PDF do pedido: solicitação da unidade, com o estoque de cada vacina (pendente) ou o que foi enviado (confirmado).
  function generatePedidoPDF(p) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF();
    var statusTxt = p.status === "confirmado" ? "Confirmado" : p.status === "cancelado" ? "Cancelado" : "Pendente";
    var conf = p.status === "confirmado" && p.confirmacao;
    var totalSol = p.itens.reduce(function (s, it) { return s + it.quantidade; }, 0);

    doc.setFontSize(16); doc.setTextColor(10, 42, 107);
    doc.text("Pedido de Imunobiológicos", 14, 18);
    doc.setFontSize(10); doc.setTextColor(90);
    doc.text("Nº " + p.numero + "   ·   Data do pedido: " + fmtDate(p.data) + "   ·   Situação: " + statusTxt + "   ·   Emitido em " + new Date().toLocaleString("pt-BR"), 14, 24);
    doc.setDrawColor(213, 222, 240); doc.line(14, 29, 196, 29);

    doc.setFontSize(10.5); doc.setTextColor(10, 42, 107);
    doc.text("Unidade solicitante", 14, 36);
    doc.setFontSize(9.5); doc.setTextColor(30);
    doc.text(doc.splitTextToSize("Unidade: " + (p.unidade || "—"), 182), 14, 42);
    doc.text("Responsável: " + (p.responsavel || "—") + "   ·   Contato: " + (p.contato || "—"), 14, 48);
    var y = 54;
    if (p.observacoes) {
      var ob = doc.splitTextToSize("Observações: " + p.observacoes, 182);
      doc.text(ob, 14, y); y += ob.length * 5 + 2;
    }

    var enviado = {};
    if (conf) (p.confirmacao.itensEnviados || []).forEach(function (it) { enviado[it.nome] = (enviado[it.nome] || 0) + it.quantidade; });
    var totalEnv = 0, totalEst = 0;
    var rows = p.itens.map(function (it) {
      var e = estoqueVacina(it.nome);
      totalEst += e.valido;
      var estTxt = String(e.valido) + (e.vencido ? " (+" + e.vencido + " vencidos)" : "");
      if (conf) {
        var env = enviado[it.nome] || 0; totalEnv += env;
        var sit = env >= it.quantidade ? "Atendido" : env > 0 ? "Parcial (" + env + " de " + it.quantidade + ")" : "Não enviado";
        return [it.nome, String(it.quantidade), String(env), estTxt, sit];
      }
      var sit2 = p.status === "cancelado" ? "Pedido cancelado" : e.valido <= 0 ? "Sem estoque válido" : e.valido < it.quantidade ? "Insuficiente (faltam " + (it.quantidade - e.valido) + ")" : "Estoque suficiente";
      return [it.nome, String(it.quantidade), estTxt, sit2];
    });
    var headRow = conf ? ["Vacina", "Solicitado (frascos)", "Enviado (frascos)", "Estoque atual (frascos)", "Situação"] : ["Vacina", "Solicitado (frascos)", "Estoque atual (frascos)", "Situação"];
    var footRow = conf ? ["Total", String(totalSol), String(totalEnv), "", ""] : ["Total", String(totalSol), "", ""];
    var colStyles = conf ? { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" } } : { 1: { halign: "right" }, 2: { halign: "right" } };
    doc.autoTable({
      startY: y + 2,
      head: [headRow],
      body: rows,
      styles: { fontSize: 9.5, cellPadding: 3.5 },
      headStyles: { fillColor: [10, 42, 107] },
      columnStyles: colStyles,
      theme: "striped",
      foot: [footRow],
      footStyles: { fillColor: [232, 238, 249], textColor: [6, 27, 74], fontStyle: "bold" }
    });

    var y2 = doc.lastAutoTable.finalY + 8;
    doc.setFontSize(8.5); doc.setTextColor(110);
    if (conf) doc.text("Guia de remessa " + p.confirmacao.remessaNumero + " emitida em " + fmtDate(p.confirmacao.data) + ".", 14, y2);
    else if (p.status === "pendente") doc.text("Estoque informado em " + new Date().toLocaleString("pt-BR") + " (frascos dentro da validade, somando todos os lotes).", 14, y2);

    y2 = Math.max(y2 + 22, 200);
    if (y2 > 260) { doc.addPage(); y2 = 40; }
    doc.setDrawColor(180, 190, 220);
    doc.line(14, y2, 90, y2); doc.line(120, y2, 196, y2);
    doc.setFontSize(9); doc.setTextColor(90);
    doc.text("Assinatura do solicitante", 14, y2 + 5);
    doc.text("Responsável pela análise do pedido", 120, y2 + 5);
    doc.save("pedido_" + p.numero + ".pdf");
  }

  function registerPedido(dados) {
    var numero = "PED-" + String(state.pedidos.length + 1).padStart(4, "0");
    var pedido = {
      id: uid(),
      numero: numero,
      data: dados.data,
      criadoEm: new Date().toISOString(),
      unidade: dados.unidade,
      responsavel: dados.responsavel,
      contato: dados.contato,
      observacoes: dados.observacoes,
      itens: dados.itens, // [{ nome, quantidade }]
      status: "pendente",
      confirmacao: null
    };
    state.pedidos = [pedido].concat(state.pedidos);
    persistData();
    gerarPdf(generatePedidoPDF, pedido);
    showToast("Pedido " + numero + " registrado" + (lastPdfOk ? " — PDF gerado" : ""));
    return pedido;
  }

  function cancelPedido(id) {
    var pedido = state.pedidos.find(function (p) { return p.id === id; });
    if (!pedido) return;
    state.pedidos = state.pedidos.map(function (p) { return p.id === id ? Object.assign({}, p, { status: "cancelado" }) : p; });
    persistData();
    showToast("Pedido " + pedido.numero + " cancelado");
  }

  function confirmPedidoWithRemessa(pedidoId, remessaDados) {
    var pedido = state.pedidos.find(function (p) { return p.id === pedidoId; });
    if (!pedido) return;
    remessaDados.pedidoNumero = pedido.numero;
    var remessa = registerRemessa(remessaDados); // já debita estoque, cria movimentações e gera o PDF
    state.pedidos = state.pedidos.map(function (p) {
      return p.id === pedidoId ? Object.assign({}, p, {
        status: "confirmado",
        confirmacao: {
          data: remessaDados.dataEnvio,
          remessaId: remessa.id,
          remessaNumero: remessa.numero,
          itensEnviados: remessaDados.itens,
          responsavelEnvio: remessaDados.responsavelOrigem
        }
      }) : p;
    });
    persistData();
    showToast("Pedido " + pedido.numero + " confirmado — guia " + remessa.numero + (lastPdfOk ? " gerada" : " registrada (PDF não gerado; use 'Baixar guia')"));
  }

  function hasConfirmCartEntries() {
    return Object.keys(confirmCart).some(function (k) { return confirmCart[k] && confirmCart[k].length > 0; });
  }
  function navActive(navKey) {
    if (navKey === state.page) return true;
    if (navKey === "pedidos" && (state.page === "novo-pedido" || state.page === "confirmar-pedido")) return true;
    return false;
  }

  function deleteBatch(id) {
    var b = state.batches.find(function (x) { return x.id === id; });
    state.batches = state.batches.filter(function (x) { return x.id !== id; });
    if (b && b.quantidade > 0) {
      state.movements = [{ id: uid(), batchId: b.id, tipo: "descarte", quantidade: b.quantidade, data: new Date().toISOString(), motivo: "Lote removido do estoque", origem: "", destino: "", vacinaNome: b.nome, lote: b.lote }].concat(state.movements);
    }
    persistData();
    closeModal();
    showToast(b ? "Lote " + b.lote + " removido" : "Lote removido");
    renderApp();
  }

  function getAlerts() {
    var vencendo = state.batches.filter(function (b) { return batchStatus(b).key === "vencendo"; });
    var vencidos = state.batches.filter(function (b) { return batchStatus(b).key === "vencido"; });
    var baixos = state.batches.filter(function (b) { return batchStatus(b).key === "baixo"; });
    return { vencendo: vencendo, vencidos: vencidos, baixos: baixos };
  }
